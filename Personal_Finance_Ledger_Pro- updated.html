            function save() { persist(); }

            /* ---------------- master helpers ---------------- */
            function activeList(arr) { return (arr || []).filter(x => x.active !== false); }
            function findById(arr, id) { return (arr || []).find(x => x.id === id); }
            function bankById(id) { return findById(DB.masters.banks, id); }
            function currencyById(id) { return findById(DB.masters.currencies, id); }
            function baseCurrency() { return DB.masters.currencies.find(c => c.isBase) || DB.masters.currencies[0]; }
            function toBase(amount, currencyId) {
                const c = currencyById(currencyId) || baseCurrency();
                return round2(Number(amount || 0) * Number(c.rate || 1));
            }
            function currSymbol(id) { const c = currencyById(id); return c ? c.symbol : '₹'; }
            function firstSubCatFor(mainCatId) {
                const m = DB.masters.expenseSubCategories.find(sc => sc.parentCategoryId === mainCatId && sc.active !== false);
                return m ? m.id : null;
            }

            /* ---------------- balance computations ---------------- */
            function bankBalance(bankId) {
                const b = bankById(bankId);
                if (!b) return 0;
                let bal = Number(b.openingBalance || 0);
                DB.transactions.forEach(t => {
                    if (t.bankId !== bankId) return;
                    bal += t.direction === 'credit' ? t.amountBase : -t.amountBase;
                });
                return round2(bal);
            }
            function allBankBalances() {
                return DB.masters.banks.map(b => ({ bank: b, balance: bankBalance(b.id) }));
            }
            function totalBankBalance() { return round2(allBankBalances().reduce((s, x) => s + x.balance, 0)); }

            function incomeHeadTotal(headId) {
                return round2(DB.transactions.filter(t => t.module === 'income' && t.refId === headId).reduce((s, t) => s + t.amountBase, 0));
            }
            function expenseCategoryTotal(catId) {
                return round2(DB.transactions.filter(t => t.module === 'expense' && t.refId === catId).reduce((s, t) => s + t.amountBase, 0));
            }
            // Expenses attributed to a given Head of Account (Active/Passive/ROI/Other Income) —
            // answers "how much of my Active Income did I actually spend?"
            function expenseHeadTotal(headId) {
                return round2(DB.transactions.filter(t => t.module === 'expense' && t.headId === headId).reduce((s, t) => s + t.amountBase, 0));
            }
            // Income / Expense (module-only, not transfers/investments/loans) for one bank —
            // used for the bank-wise Income / Expense / Balance table on the dashboard.
            function bankIncomeTotal(bankId) {
                return round2(DB.transactions.filter(t => t.module === 'income' && t.bankId === bankId).reduce((s, t) => s + t.amountBase, 0));
            }
            function bankExpenseTotal(bankId) {
                return round2(DB.transactions.filter(t => t.module === 'expense' && t.bankId === bankId).reduce((s, t) => s + t.amountBase, 0));
            }
            // Sub-ledger: every active Bank x Income-Head combination, each with its own
            // Opening Balance (user-entered, optional, dated "as on") / Credit / Debit / Closing Balance —
            // e.g. "Bank-A - Active Income", "Bank-A - Passive Income", "Bank-B - Active Income" ...
            function subledgerKey(bankId, headId) { return bankId + '|' + headId; }
            function subledgerEntry(bankId, headId) { return (DB.openingBalances || {})[subledgerKey(bankId, headId)] || null; }
            function subledgerOpeningBalance(bankId, headId) {
                const e = subledgerEntry(bankId, headId);
                return e ? Number(e.amount || 0) : 0;
            }
            function subledgerOpeningDate(bankId, headId) {
                const e = subledgerEntry(bankId, headId);
                return e ? (e.asOnDate || '') : '';
            }
            function setSubledgerOpeningBalance(bankId, headId, value) {
                const key = subledgerKey(bankId, headId);
                const v = round2(Number(value) || 0);
                if (!DB.openingBalances) DB.openingBalances = {};
                const existing = DB.openingBalances[key];
                if (v === 0) { delete DB.openingBalances[key]; }
                else { DB.openingBalances[key] = { amount: v, asOnDate: (existing && existing.asOnDate) || todayStr() }; }
                save();
                renderContent();
            }
            function setSubledgerOpeningDate(bankId, headId, dateValue) {
                const key = subledgerKey(bankId, headId);
                if (!DB.openingBalances) DB.openingBalances = {};
                const existing = DB.openingBalances[key];
                if (!existing) { toast('Enter an opening balance amount first', 'error'); renderContent(); return; }
                existing.asOnDate = dateValue || todayStr();
                save();
                renderContent();
            }
            function buildSubledgerRows(banksList, headsList) {
                const banks = banksList || activeList(DB.masters.banks);
                const heads = headsList || activeList(DB.masters.incomeHeads);
                const rows = [];
                banks.forEach(b => {
                    heads.forEach(h => {
                        const ob = subledgerOpeningBalance(b.id, h.id);
                        const obDate = subledgerOpeningDate(b.id, h.id);
                        const credit = round2(DB.transactions.filter(t => t.module === 'income' && t.bankId === b.id && t.refId === h.id).reduce((s, t) => s + t.amountBase, 0));
                        const debit = round2(DB.transactions.filter(t => t.module === 'expense' && t.bankId === b.id && t.headId === h.id).reduce((s, t) => s + t.amountBase, 0));
                        const closing = round2(ob + credit - debit);
                        rows.push({ bank: b, head: h, ob, obDate, credit, debit, closing });
                    });
                });
                return rows;
            }
            // Groups buildSubledgerRows() output by Bank, with a subtotal per bank and one
            // grand total at the end — Bank-A's heads, then a Bank-A Total row, then
            // Bank-B's heads, then a Bank-B Total row, and so on.
            function buildSubledgerGrouped(banksList, headsList) {
                const banks = banksList || activeList(DB.masters.banks);
                const heads = headsList || activeList(DB.masters.incomeHeads);
                const groups = banks.map(b => {
                    const rows = buildSubledgerRows([b], heads);
                    const subtotal = rows.reduce((a, r) => ({ ob: a.ob + r.ob, credit: a.credit + r.credit, debit: a.debit + r.debit, closing: a.closing + r.closing }), { ob: 0, credit: 0, debit: 0, closing: 0 });
                    return { bank: b, rows, subtotal: { ob: round2(subtotal.ob), credit: round2(subtotal.credit), debit: round2(subtotal.debit), closing: round2(subtotal.closing) } };
                });
                const grandTotal = groups.reduce((a, g) => ({ ob: a.ob + g.subtotal.ob, credit: a.credit + g.subtotal.credit, debit: a.debit + g.subtotal.debit, closing: a.closing + g.subtotal.closing }), { ob: 0, credit: 0, debit: 0, closing: 0 });
                return { groups, grandTotal: { ob: round2(grandTotal.ob), credit: round2(grandTotal.credit), debit: round2(grandTotal.debit), closing: round2(grandTotal.closing) } };
            }
            // Opening balance aggregated by Head (summed across every bank) / by Bank (summed across every head) —
            // powers the Opening Balance row on each dashboard statement.
            function openingBalanceForHead(headId) {
                return round2(DB.masters.banks.reduce((s, b) => s + subledgerOpeningBalance(b.id, headId), 0));
            }
            function openingBalanceForBank(bankId) {
                return round2(DB.masters.incomeHeads.reduce((s, h) => s + subledgerOpeningBalance(bankId, h.id), 0));
            }
            function grandOpeningBalance() {
                return round2(Object.values(DB.openingBalances || {}).reduce((s, v) => s + Number((v && v.amount) || 0), 0));
            }
            // Net amount currently tied up in Savings/Investments, attributable to a Head of
            // Account or a Bank — invested principal (investment_out) minus redeemed principal
            // (investment_in). Positive = money still parked in investments.
            function investmentNetForHead(headId) {
                const out = DB.transactions.filter(t => t.module === 'investment_out' && t.headId === headId).reduce((s, t) => s + t.amountBase, 0);
                const inn = DB.transactions.filter(t => t.module === 'investment_in' && t.headId === headId).reduce((s, t) => s + t.amountBase, 0);
                return round2(out - inn);
            }
            function investmentNetForBank(bankId) {
                const out = DB.transactions.filter(t => t.module === 'investment_out' && t.bankId === bankId).reduce((s, t) => s + t.amountBase, 0);
                const inn = DB.transactions.filter(t => t.module === 'investment_in' && t.bankId === bankId).reduce((s, t) => s + t.amountBase, 0);
                return round2(out - inn);
            }
            function grandInvestmentNet() {
                const out = DB.transactions.filter(t => t.module === 'investment_out').reduce((s, t) => s + t.amountBase, 0);
                const inn = DB.transactions.filter(t => t.module === 'investment_in').reduce((s, t) => s + t.amountBase, 0);
                return round2(out - inn);
            }
            // Net cash effect of Loans & Borrowings, attributable to a Head of Account or a
            // Bank — money borrowed in (loan_taken, loan_collect) minus money repaid/lent out
            // (loan_repay, loan_given). These carry a Head of Account like every other entry
            // segment, but were previously invisible on the dashboard because the
            // Income/Expense rows only look at the income and expense modules — this is
            // what makes a loan credit "disappear" from the Source-wise / Bank-wise view.
            function netLoanForHead(headId) {
                const inflow = DB.transactions.filter(t => (t.module === 'loan_taken' || t.module === 'loan_collect') && t.headId === headId).reduce((s, t) => s + t.amountBase, 0);
                const outflow = DB.transactions.filter(t => (t.module === 'loan_given' || t.module === 'loan_repay') && t.headId === headId).reduce((s, t) => s + t.amountBase, 0);
                return round2(inflow - outflow);
            }
            function netLoanForBank(bankId) {
                const inflow = DB.transactions.filter(t => (t.module === 'loan_taken' || t.module === 'loan_collect') && t.bankId === bankId).reduce((s, t) => s + t.amountBase, 0);
                const outflow = DB.transactions.filter(t => (t.module === 'loan_given' || t.module === 'loan_repay') && t.bankId === bankId).reduce((s, t) => s + t.amountBase, 0);
                return round2(inflow - outflow);
            }
            function grandNetLoan() {
                const inflow = DB.transactions.filter(t => t.module === 'loan_taken' || t.module === 'loan_collect').reduce((s, t) => s + t.amountBase, 0);
                const outflow = DB.transactions.filter(t => t.module === 'loan_given' || t.module === 'loan_repay').reduce((s, t) => s + t.amountBase, 0);
                return round2(inflow - outflow);
            }
            function totalIncome() { return round2(DB.transactions.filter(t => t.module === 'income').reduce((s, t) => s + t.amountBase, 0)); }
            function totalExpense() { return round2(DB.transactions.filter(t => t.module === 'expense').reduce((s, t) => s + t.amountBase, 0)); }
            function totalCredit() { return round2(DB.transactions.filter(t => t.direction === 'credit').reduce((s, t) => s + t.amountBase, 0)); }
            function totalDebit() { return round2(DB.transactions.filter(t => t.direction === 'debit').reduce((s, t) => s + t.amountBase, 0)); }
            function cashBalance() {
                const cash = DB.masters.banks.find(b => b.name.toLowerCase() === 'cash');
                return cash ? bankBalance(cash.id) : 0;
            }
            function totalInvestmentValue() { return round2(DB.investments.reduce((s, i) => s + Number(i.currentValue || 0), 0)); }
            function totalLoansGivenOutstanding() { return round2(DB.loans.filter(l => l.kind === 'given').reduce((s, l) => s + Number(l.outstanding || 0), 0)); }
            function totalLoansTakenOutstanding() { return round2(DB.loans.filter(l => l.kind === 'taken').reduce((s, l) => s + Number(l.outstanding || 0), 0)); }
            function netWorth() {
                return round2(totalBankBalance() + grandOpeningBalance() + totalInvestmentValue() + totalLoansGivenOutstanding() - totalLoansTakenOutstanding());
            }

            // Measures the real rendered width of each frozen column (widths vary with
            // content, so this can't be done in pure CSS) and pins them with the correct
            // cumulative left-offset, matching row background, and a shadow divider on the
            // last frozen column — used by the Transaction Register and Reports tables.
            function applyFreezeColumns() {
                document.querySelectorAll('#content .table-wrap.freeze-cols table').forEach(table => {
                    const headRow = table.querySelector('thead tr');
                    if (!headRow) return;
                    const frozenHeaders = [...headRow.children].filter(c => c.classList.contains('frozen-col'));
                    if (!frozenHeaders.length) return;
                    let cumulative = 0;
                    const offsets = frozenHeaders.map(cell => {
                        const left = cumulative;
                        cumulative += cell.getBoundingClientRect().width;
                        return left;
                    });
                    table.querySelectorAll('tr').forEach(row => {
                        const frozenCells = [...row.children].filter(c => c.classList.contains('frozen-col'));
                        frozenCells.forEach((cell, i) => {
                            cell.style.left = (offsets[i] || 0) + 'px';
                            cell.classList.toggle('frozen-edge', i === frozenCells.length - 1);
                        });
                    });
                    [...table.querySelectorAll('tbody tr')].forEach((row, idx) => {
                        const bg = idx % 2 === 1 ? 'var(--paper-dim)' : 'var(--paper-card)';
                        [...row.children].forEach(cell => { if (cell.classList.contains('frozen-col')) cell.style.background = bg; });
                    });
                    table.querySelectorAll('thead th.frozen-col').forEach(cell => { cell.style.background = 'var(--paper-dim)'; });
                    table.querySelectorAll('tfoot td.frozen-col').forEach(cell => { cell.style.background = 'var(--paper-card)'; });
                });
            }

            /* ================= DASHBOARD ================= */
            function kpi(label, value, sub, cls) {
                return `<div class="card kpi">

            function viewDashboard() {
                const banks = allBankBalances();
                const nw = netWorth();
                const heads = activeList(DB.masters.incomeHeads);
                const bankList = activeList(DB.masters.banks);

                // ---------- Source-wise Statement (by Head of Account) ----------
                const srcOpeningRow = heads.map(h => kpi(h.name + ' Opening Balance', openingBalanceForHead(h.id))).join('')
                    + kpi('Grand Total Opening Balance', grandOpeningBalance());
                const srcIncomeRow = heads.map(h => kpi(h.name, incomeHeadTotal(h.id))).join('')
                    + kpi('Grand Total Income', totalIncome(), '', '');
                const srcExpenseRow = heads.map(h => kpi('Expenses from ' + h.name, expenseHeadTotal(h.id), '', 'debit')).join('')
                    + kpi('Grand Total Expenses', totalExpense(), '', 'debit');
                const srcBalanceOf = h => round2(openingBalanceForHead(h.id) + incomeHeadTotal(h.id) - expenseHeadTotal(h.id));
                const srcGrandBalance = round2(grandOpeningBalance() + totalIncome() - totalExpense());
                const srcBalanceRow = heads.map(h => { const bal = srcBalanceOf(h); return kpi(h.name + ' Balance', bal, '', bal < 0 ? 'debit' : 'credit'); }).join('')
                    + kpi('Grand Total Balance', srcGrandBalance, '', srcGrandBalance < 0 ? 'debit' : 'credit');
                const srcInvestRow = heads.map(h => kpi(h.name + ' Savings/Investment', investmentNetForHead(h.id))).join('')
                    + kpi('Grand Total Savings/Investment', grandInvestmentNet());
                const srcLoanRow = heads.map(h => kpi(h.name + ' Loans/Borrowings', netLoanForHead(h.id), 'Borrowed in − repaid/lent out')).join('')
                    + kpi('Grand Total Loans/Borrowings', grandNetLoan(), 'Borrowed in − repaid/lent out');
                const srcFinalOf = h => round2(srcBalanceOf(h) - investmentNetForHead(h.id) + netLoanForHead(h.id));
                const srcGrandFinal = round2(srcGrandBalance - grandInvestmentNet() + grandNetLoan());
                const srcFinalRow = heads.map(h => { const fb = srcFinalOf(h); return kpi(h.name + ' Final Balance', fb, 'After Investment &amp; Loans', fb < 0 ? 'debit' : 'credit'); }).join('')
                    + kpi('Grand Final Balance', srcGrandFinal, 'After Investment &amp; Loans', srcGrandFinal < 0 ? 'debit' : 'credit');

                // ---------- Bank-wise Statement (mirrors the same rows, grouped by Bank) ----------
                const bnkOpeningRow = bankList.map(b => kpi(b.name + ' Opening Balance', openingBalanceForBank(b.id))).join('')
                    + kpi('Grand Total Opening Balance', grandOpeningBalance());
                const bnkIncomeRow = bankList.map(b => kpi(b.name, bankIncomeTotal(b.id))).join('')
                    + kpi('Grand Total Income', totalIncome(), '', '');
                const bnkExpenseRow = bankList.map(b => kpi('Expenses from ' + b.name, bankExpenseTotal(b.id), '', 'debit')).join('')
                    + kpi('Grand Total Expenses', totalExpense(), '', 'debit');
                const bnkBalanceOf = b => round2(openingBalanceForBank(b.id) + bankIncomeTotal(b.id) - bankExpenseTotal(b.id));
                const bnkGrandBalance = round2(grandOpeningBalance() + totalIncome() - totalExpense());
                const bnkBalanceRow = bankList.map(b => { const bal = bnkBalanceOf(b); return kpi(b.name + ' Balance', bal, '', bal < 0 ? 'debit' : 'credit'); }).join('')
                    + kpi('Grand Total Balance', bnkGrandBalance, '', bnkGrandBalance < 0 ? 'debit' : 'credit');
                const bnkInvestRow = bankList.map(b => kpi(b.name + ' Savings/Investment', investmentNetForBank(b.id))).join('')
                    + kpi('Grand Total Savings/Investment', grandInvestmentNet());
                const bnkLoanRow = bankList.map(b => kpi(b.name + ' Loans/Borrowings', netLoanForBank(b.id), 'Borrowed in − repaid/lent out')).join('')
                    + kpi('Grand Total Loans/Borrowings', grandNetLoan(), 'Borrowed in − repaid/lent out');
                const bnkFinalOf = b => round2(bnkBalanceOf(b) - investmentNetForBank(b.id) + netLoanForBank(b.id));
                const bnkGrandFinal = round2(bnkGrandBalance - grandInvestmentNet() + grandNetLoan());
                const bnkFinalRow = bankList.map(b => { const fb = bnkFinalOf(b); return kpi(b.name + ' Final Balance', fb, 'After Investment &amp; Loans', fb < 0 ? 'debit' : 'credit'); }).join('')
                    + kpi('Grand Final Balance', bnkGrandFinal, 'After Investment &amp; Loans', bnkGrandFinal < 0 ? 'debit' : 'credit');

                const tallied = Math.abs(srcGrandFinal - bnkGrandFinal) < 0.01;

                let html = `
  <div class="panel-head" style="margin-bottom:2px;">
    <h3 style="font-family:var(--font-display);">Source-wise Statement <span style="font-weight:400;color:var(--slate);font-size:13px;">(by Head of Account)</span></h3>

            function recentTxTable() {

    </tr>`).join('')}</tbody></table></div>`;
            }
            function currencyExposureTable() {
                const map = {};
                DB.transactions.forEach(t => {
                    const c = currencyById(t.currencyId) || baseCurrency();
                    map[c.code] = map[c.code] || { code: c.code, symbol: c.symbol, amount: 0, base: 0 };
                    map[c.code].amount += t.direction === 'credit' ? t.amount : -t.amount;
                    map[c.code].base += t.direction === 'credit' ? t.amountBase : -t.amountBase;
                });
                const rows = Object.values(map);
                if (!rows.length) return emptyState('No currency activity', 'Transactions in any currency will summarize here.');

                const map = {
                    income: 'Income', expense: 'Expense', transfer: 'Transfer', investment_out: 'Investment', investment_in: 'Redemption',

                },

                    fields: [
                        { k: 'code', label: 'Currency Code (e.g. USD)', type: 'text', required: true },
                        { k: 'symbol', label: 'Symbol (e.g. $)', type: 'text', required: true },

                    fields: [{ k: 'name', label: 'Investment Type Name', type: 'text', required: true }],
                    usedCheck: (id) => DB.investments.some(i => i.investmentTypeId === id)
                },
                riskCategories: {
                    title: 'Risk Category Master (Investments)', key: 'riskCategories', label: 'Risk Category',
                    columns: [{ k: 'name', label: 'Name' }],
                    fields: [{ k: 'name', label: 'Risk Category Name', type: 'text', required: true }],

            function viewMasters() {
                const tabs = Object.keys(MASTER_CONFIG);
                return `
  <div class="tabs">

  </div>`;
            }
            function setMasterTab(t) { MASTER_TAB = t; document.getElementById('master-panel').innerHTML = renderMasterPanel(t); }
            function renderMasterPanel(tabKey) {
                const cfg = MASTER_CONFIG[tabKey];
                const rows = DB.masters[cfg.key];
                return `
  <div class="card">
    <div class="table-toolbar" style="justify-content:space-between;">
      <div style="font-weight:600;font-size:13.5px;">${rows.length} ${cfg.label}${rows.length === 1 ? '' : 's'}</div>

    </div>
    ${rows.length ? `<div class="table-wrap" style="border:none;border-radius:0;"><table>
      <thead><tr>${cfg.columns.map(c => `<th>${c.label}</th>`).join('')}<th>Status</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        ${cfg.columns.map(c => `<td>${renderMasterCell(r, c)}</td>`).join('')}

        <td><div class="row-actions">

            }
            function renderMasterCell(r, c) {
                let v = r[c.k];
                if (c.money) return '₹ ' + fmt2(v);
                if (c.date) return fmtDate(v);
                if (c.bool) return v ? '✓' : '';
                if (c.lookup) return esc(findById(DB.masters[c.lookup], v)?.name || '—');
                return esc(v == null ? '' : v);
            }
            function openMasterForm(tabKey, id) {
                const cfg = MASTER_CONFIG[tabKey];
                const rec = id ? findById(DB.masters[cfg.key], id) : null;
                const isBaseCurrencyRow = tabKey === 'currencies' && rec && rec.isBase;
                openModal(`
    <div class="modal-head"><h3>${rec ? 'Edit' : 'Add'} ${cfg.label}</h3><button class="btn btn-icon btn-ghost" onclick="PFL.closeModal()">✕</button></div>

      <div class="form-grid">
        ${cfg.fields.map(f => `
          <div class="field ${f.type === 'textarea' ? 'full' : ''}">
            <label>${f.label} ${f.required ? '<span class="req">*</span>' : ''}</label>

            <div class="err"></div>
          </div>`).join('')}
      </div>
      ${isBaseCurrencyRow ? '<div class="hint">This is the base currency — its code, symbol and rate are locked to 1.</div>' : ''}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save ${cfg.label}</button>
        <button type="button" class="btn btn-ghost" onclick="PFL.closeModal()">Cancel</button>
      </div>
    </form>
  `);
            }
            function renderFieldInput(f, rec, locked) {
                const val = rec ? rec[f.k] : (f.def !== undefined ? f.def : '');
                const dis = locked ? 'disabled' : '';
                if (f.type === 'select') {
                    const opts = typeof f.options === 'function' ? f.options() : f.options;
                    return `<select name="${f.k}" ${dis}>${opts.map(([v, l]) => `<option value="${v}" ${val === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
                }
                if (f.type === 'number') {
                    return `<input type="number" step="0.01" name="${f.k}" value="${val}" ${dis}/>`;
                }
                if (f.type === 'date') {
                    return `<input type="date" name="${f.k}" value="${val}" ${dis}/>`;

                    const input = form.elements[f.k];
                    let v = input.value;
                    if (f.type === 'number') v = v === '' ? NaN : Number(v);
                    if (f.required && (v === '' || v === undefined || (f.type === 'number' && isNaN(v)))) {
                        input.classList.add('invalid'); valid = false;
                    } else input.classList.remove('invalid');
                    data[f.k] = v;
                });
                if (!valid) { toast('Please fill all required fields', 'error'); return false; }

                    const rec = findById(DB.masters[cfg.key], id);

          ${subCats.map(sc => `<button type="button" class="${chip(QUICK_STATE.subCat === sc.id, 'btn-primary')}" onclick="PFL.setQuickField('subCat','${sc.id}')">${esc(sc.name)}</button>`).join('')}

      <div class="panel-head"><h3>Just Logged</h3><a class="btn btn-sm btn-ghost" onclick="PFL.go('register')">Full register →</a></div>

            function recentQuickEntries() {
                const rows = DB.transactions.filter(t => (t.module === 'income' || t.module === 'expense'))
                    .sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 6);
                if (!rows.length) return emptyState('Nothing logged yet', 'Entries you save will appear here.');
                return `<div class="table-wrap" style="border:none;"><table>
    <thead><tr><th>Date</th><th>Description</th><th style="text-align:right;">Amount</th><th>By</th></tr></thead>
    <tbody>${rows.map(t => `<tr>
      <td>${fmtDate(t.date)}</td>
      <td class="wrap">${esc(t.description || categoryLabelFor(t))}</td>
      <td class="num ${t.direction}" style="text-align:right;">${t.direction === 'credit' ? '+' : '−'} ${currSymbol(t.currencyId)}${fmt2(t.amount)}</td>
      <td><span class="badge">${esc(t.createdBy || '—')}</span></td>
    </tr>`).join('')}</tbody></table></div>`;
            }
            function saveQuickEntry() {
                captureQuickInputs();
                const amount = round2(Number(QUICK_STATE.amount));
                if (!amount || amount <= 0) { toast('Enter a valid amount', 'error'); return; }
                if (!QUICK_STATE.bankId) { toast('Select a bank account', 'error'); return; }
                if (!QUICK_STATE.headId) { toast('Select a Head of Account / Income Head', 'error'); return; }
                const isExpense = QUICK_STATE.type === 'expense';
                if (isExpense && !QUICK_STATE.mainCat) { toast('Select a category', 'error'); return; }
                const baseCur = baseCurrency();
                const now = new Date().toISOString();
                if (isExpense) {
                    const subCatId = QUICK_STATE.subCat || firstSubCatFor(QUICK_STATE.mainCat);
                    DB.transactions.push({
                        id: uid('tx'), module: 'expense', date: todayStr(), description: QUICK_STATE.note || '', bankId: QUICK_STATE.bankId,
                        refId: QUICK_STATE.mainCat, headId: QUICK_STATE.headId, subCategoryId: subCatId, direction: 'debit', amount, currencyId: baseCur.id, amountBase: toBase(amount, baseCur.id),
                        remarks: '', createdAt: now, updatedAt: now, createdBy: currentUserName()
                    });
                } else {
                    DB.transactions.push({
                        id: uid('tx'), module: 'income', date: todayStr(), description: QUICK_STATE.note || '', bankId: QUICK_STATE.bankId,
                        refId: QUICK_STATE.headId, headId: QUICK_STATE.headId, direction: 'credit', amount, currencyId: baseCur.id, amountBase: toBase(amount, baseCur.id),
                        remarks: '', createdAt: now, updatedAt: now, createdBy: currentUserName()
                    });
                }
                save();
                toast((isExpense ? 'Expense' : 'Income') + ' logged — ' + currSymbol(baseCur.id) + fmt2(amount));
                QUICK_STATE.amount = ''; QUICK_STATE.note = ''; QUICK_STATE.mainCat = ''; QUICK_STATE.subCat = '';
                renderContent();
            }

            let INCOME_SUBTAB = 'entry';
            function viewIncomeEntryPage() {
                const tabs = [['entry', 'New Entry'], ['subledger', 'Opening Balance & Sub-Ledger']];
                return `
  <div class="tabs no-print">${tabs.map(([v, l]) => `<div class="tab ${INCOME_SUBTAB === v ? 'active' : ''}" onclick="PFL.setIncomeSubTab('${v}')">${l}</div>`).join('')}</div>
  ${INCOME_SUBTAB === 'subledger' ? viewIncomeSubledger() : viewEntry('income')}`;
            }
            function setIncomeSubTab(t) { INCOME_SUBTAB = t; renderContent(); }
            function viewIncomeSubledger() {
                const banks = activeList(DB.masters.banks);
                const heads = activeList(DB.masters.incomeHeads);
                if (!banks.length || !heads.length) return emptyState('Nothing to show yet', 'Add at least one bank account and one income head in Masters first.');
                const { groups, grandTotal } = buildSubledgerGrouped(banks, heads);
                return `
  <div class="card card-pad" style="margin-bottom:16px;">
    <div class="panel-head"><h3>Opening Balance by Bank &amp; Source of Income</h3></div>
    <p class="hint">Optional — only fill this in if you're starting the app with money that was already sitting against a particular income source in a particular bank (e.g. money already saved from Active Income in Bank-A). Leave blank to start at zero. Set the <b>As On</b> date to record when that opening figure applied. Each Bank groups its Source-of-Income rows below it with its own subtotal, and the whole sub-ledger cumulates to a Grand Total at the bottom.</p>
  </div>
  <div class="card">
    <div class="table-wrap" style="border:none;border-radius:0;">
      <table>
        <thead><tr>
          <th>Source of Income</th>

          <th>As On Date</th>
          <th style="text-align:right;">Credit</th>
          <th style="text-align:right;">Debit</th>
          <th style="text-align:right;">Closing Balance</th>
        </tr></thead>
        ${groups.map(g => `
        <tbody>
          <tr style="background:var(--paper-dim);">
            <td colspan="6" style="font-weight:700;font-family:var(--font-display);letter-spacing:.2px;">${esc(g.bank.name)}</td>
          </tr>
          ${g.rows.map(r => `<tr>
            <td style="padding-left:26px;">${esc(r.head.name)}</td>
            <td style="text-align:right;">
              <input type="number" step="0.01" value="${r.ob || ''}" placeholder="0.00" style="width:120px;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper-card);color:var(--ink);font-family:var(--font-mono);"
                onchange="PFL.setSubledgerOpeningBalance('${r.bank.id}','${r.head.id}',this.value)"/>
            </td>
            <td>
              <input type="date" value="${r.obDate || ''}" ${r.ob ? '' : 'disabled'} style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper-card);color:var(--ink);"
                onchange="PFL.setSubledgerOpeningDate('${r.bank.id}','${r.head.id}',this.value)"/>
            </td>
            <td class="num credit" style="text-align:right;">₹${fmt2(r.credit)}</td>
            <td class="num debit" style="text-align:right;">₹${fmt2(r.debit)}</td>
            <td class="num" style="text-align:right;font-weight:600;${r.closing < 0 ? 'color:var(--rust)' : ''}">₹${fmt2(r.closing)}</td>
          </tr>`).join('')}
          <tr style="font-weight:700;border-top:1px solid var(--line);">
            <td>${esc(g.bank.name)} Total</td>
            <td class="num" style="text-align:right;">₹${fmt2(g.subtotal.ob)}</td>
            <td></td>
            <td class="num credit" style="text-align:right;">₹${fmt2(g.subtotal.credit)}</td>
            <td class="num debit" style="text-align:right;">₹${fmt2(g.subtotal.debit)}</td>
            <td class="num" style="text-align:right;${g.subtotal.closing < 0 ? 'color:var(--rust)' : ''}">₹${fmt2(g.subtotal.closing)}</td>
          </tr>
        </tbody>`).join('')}
        <tfoot><tr style="font-weight:700;border-top:2px solid var(--brass);">
          <td>Grand Total</td>
          <td class="num" style="text-align:right;">₹${fmt2(grandTotal.ob)}</td>
          <td></td>
          <td class="num credit" style="text-align:right;">₹${fmt2(grandTotal.credit)}</td>
          <td class="num debit" style="text-align:right;">₹${fmt2(grandTotal.debit)}</td>
          <td class="num" style="text-align:right;">₹${fmt2(grandTotal.closing)}</td>
        </tr></tfoot>
      </table>
    </div>
  </div>`;
            }
            function viewEntry(module) {
                ENTRY_EDIT_ID = null;
                const isIncome = module === 'income';
                const catList = isIncome ? activeList(DB.masters.incomeHeads) : activeList(DB.masters.expenseCategories);
                const catLabel = isIncome ? 'Income Head' : 'Main Category of Expense';
                const heads = activeList(DB.masters.incomeHeads);
                const banks = activeList(DB.masters.banks);
                const currencies = activeList(DB.masters.currencies);
                const firstCat = catList[0];
                const subOptionsHtml = isIncome ? '' : subCategoryOptionsHtml(firstCat ? firstCat.id : null);
                return `
  <div class="grid" style="grid-template-columns:1.1fr .9fr;gap:18px;">
    <div class="card card-pad">
      <div class="panel-head"><h3>${isIncome ? 'Income' : 'Expense'} Entry</h3><span class="badge" id="entry-mode-badge">New Entry</span></div>
      <form id="entry-form" onsubmit="return PFL.saveEntry(event,'${module}')">
        <div class="form-grid">
          <div class="field"><label>Transaction Date <span class="req">*</span></label>
            <input type="date" name="date" value="${todayStr()}" required/><div class="err"></div>
          </div>
          <div class="field"><label>Transaction Type <span class="req">*</span></label>
            <select name="direction">
              <option value="${isIncome ? 'credit' : 'debit'}" selected>${isIncome ? 'Credit (money in)' : 'Debit (money out)'}</option>
              <option value="${isIncome ? 'debit' : 'credit'}">${isIncome ? 'Debit (correction / refund out)' : 'Credit (refund in)'}</option>
            </select>
          </div>
          <div class="field full"><label>Description <span class="badge">Optional</span></label>
            <input type="text" name="description" placeholder="e.g. ${isIncome ? 'Monthly salary' : 'Paid to M/s AAA Stores'}"/><div class="err"></div>
          </div>
          <div class="field"><label>Source of Bank <span class="req">*</span></label>
            <select name="bankId" required>${banks.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select>
            <div class="hint">Add more from Masters → Bank &amp; Cash Accounts</div>
          </div>
          ${isIncome ? `
          <div class="field"><label>${catLabel} <span class="req">*</span></label>
            <select name="refId" required>${catList.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
            <div class="hint">Editable in Masters → Income Head Master</div>
          </div>` : `
          <div class="field"><label>Head of Account <span class="req">*</span></label>
            <select name="headId" required>${heads.map(h => `<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select>
            <div class="hint">Which income source this expense is drawn against</div>
          </div>
          <div class="field"><label>${catLabel} <span class="req">*</span></label>
            <select name="refId" required onchange="PFL.onMainCategoryChange(this)">${catList.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
            <div class="hint">Editable in Masters → Expense Type Master</div>
          </div>
          <div class="field"><label>Sub Category of Expense <span class="req">*</span></label>
            <select name="subCategoryId" id="subcat-select" required>${subOptionsHtml}</select>
            <div class="hint">Editable in Masters → Expense Sub-Category Master</div>
          </div>`}
          <div class="field"><label>Amount <span class="req">*</span></label>
            <input type="number" step="0.01" min="0.01" name="amount" placeholder="0.00" required/><div class="err"></div>
          </div>
          <div class="field"><label>Currency</label>
            <select name="currencyId">${currencies.map(c => `<option value="${c.id}" ${c.isBase ? 'selected' : ''}>${c.code} (${c.symbol})</option>`).join('')}</select>
          </div>
          <div class="field full"><label>Remarks</label>
            <textarea name="remarks" placeholder="Optional notes"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-brass" id="update-btn" style="display:none;" onclick="PFL.updateEntry('${module}')">Update</button>
          <button type="button" class="btn btn-danger" id="delete-btn" style="display:none;" onclick="PFL.deleteEntryFromForm()">Delete</button>
          <button type="button" class="btn btn-ghost" onclick="PFL.clearEntryForm('${module}')">Clear</button>
          <button type="button" class="btn btn-ghost" onclick="PFL.go('dashboard')">Cancel</button>
        </div>
      </form>
    </div>
    <div class="card card-pad">
      <div class="panel-head"><h3>Recent ${isIncome ? 'Income' : 'Expense'} Entries</h3></div>
      ${recentModuleTable(module)}
    </div>
  </div>`;
            }
            function subCategoryOptionsHtml(mainCatId, selectedId) {
                const subs = activeList(DB.masters.expenseSubCategories).filter(sc => sc.parentCategoryId === mainCatId);
                if (!subs.length) return `<option value="">— none defined —</option>`;
                return subs.map(sc => `<option value="${sc.id}" ${sc.id === selectedId ? 'selected' : ''}>${esc(sc.name)}</option>`).join('');
            }
            function onMainCategoryChange(sel) {
                const subSel = document.getElementById('subcat-select');
                if (subSel) subSel.innerHTML = subCategoryOptionsHtml(sel.value);
            }
            function recentModuleTable(module) {
                const rows = DB.transactions.filter(t => t.module === module).sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 10);
                if (!rows.length) return emptyState('No entries yet', 'Entries you save will appear here for quick editing.');
                const isIncome = module === 'income';
                return `<div class="table-wrap" style="border:none;"><table>
    <thead><tr><th>Date</th><th>Description</th>${isIncome ? '' : '<th>Head of Account</th>'}<th>${isIncome ? 'Income Head' : 'Main Category'}</th>${isIncome ? '' : '<th>Sub Category</th>'}<th style="text-align:right;">Amount</th><th></th></tr></thead>
    <tbody>${rows.map(t => {
                    const cat = isIncome ? findById(DB.masters.incomeHeads, t.refId) : findById(DB.masters.expenseCategories, t.refId);
                    const head = isIncome ? null : findById(DB.masters.incomeHeads, t.headId);
                    const subCat = isIncome ? null : findById(DB.masters.expenseSubCategories, t.subCategoryId);
                    return `<tr>
      <td>${fmtDate(t.date)}</td>
      <td class="wrap">${esc(t.description || '—')}</td>
      ${isIncome ? '' : `<td>${esc(head ? head.name : '—')}</td>`}
      <td>${esc(cat ? cat.name : '—')}</td>
      ${isIncome ? '' : `<td>${esc(subCat ? subCat.name : '—')}</td>`}
      <td class="num ${t.direction}" style="text-align:right;">${currSymbol(t.currencyId)}${fmt2(t.amount)}</td>
      <td><button class="btn btn-sm btn-ghost" onclick="PFL.editEntry('${module}','${t.id}')">Edit</button></td>
    </tr>`;
                }).join('')}</tbody></table></div>`;
            }
            function validateEntryForm(form, module) {
                let valid = true;
                const keys = ['date', 'bankId', 'refId', 'amount'];
                if (module === 'expense') keys.push('headId', 'subCategoryId');
                keys.forEach(k => {
                    const el = form.elements[k];
                    if (!el) return;
                    const bad = !el.value || (k === 'amount' && Number(el.value) <= 0);
                    el.classList.toggle('invalid', bad);
                    if (bad) valid = false;
                });
                return valid;
            }
            function readEntryForm(form) {
                return {
                    date: form.elements.date.value,
                    direction: form.elements.direction.value,
                    description: form.elements.description.value.trim(),
                    bankId: form.elements.bankId.value,
                    refId: form.elements.refId.value,
                    headId: form.elements.headId ? form.elements.headId.value : null,
                    subCategoryId: form.elements.subCategoryId ? form.elements.subCategoryId.value : null,
                    amount: round2(Number(form.elements.amount.value)),
                    currencyId: form.elements.currencyId.value,
                    remarks: form.elements.remarks.value.trim()
                };
            }
            function saveEntry(ev, module) {
                ev.preventDefault();
                const form = ev.target;
                if (!validateEntryForm(form, module)) { toast('Please complete all required fields correctly', 'error'); return false; }
                const d = readEntryForm(form);
                const t = {
                    id: uid('tx'), module, date: d.date, description: d.description, bankId: d.bankId, refId: d.refId,
                    headId: module === 'income' ? d.refId : d.headId,
                    subCategoryId: module === 'expense' ? d.subCategoryId : undefined,
                    direction: d.direction, amount: d.amount, currencyId: d.currencyId, amountBase: toBase(d.amount, d.currencyId),
                    remarks: d.remarks, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), createdBy: currentUserName()
                };
                DB.transactions.push(t);
                save();
                toast(`${module === 'income' ? 'Income' : 'Expense'} entry saved`);
                renderContent();
            }
            function editEntry(module, id) {
                if (!go(module)) return;
                setTimeout(() => {
                    const t = findById(DB.transactions, id);
                    if (!t) return;
                    ENTRY_EDIT_ID = id;
                    const form = document.getElementById('entry-form');
                    form.elements.date.value = t.date;
                    form.elements.direction.value = t.direction;
                    form.elements.description.value = t.description || '';
                    form.elements.bankId.value = t.bankId;
                    form.elements.refId.value = t.refId;
                    if (form.elements.headId) form.elements.headId.value = t.headId || '';
                    if (form.elements.subCategoryId) {
                        form.elements.subCategoryId.innerHTML = subCategoryOptionsHtml(t.refId, t.subCategoryId);
                    }
                    form.elements.amount.value = t.amount;
                    form.elements.currencyId.value = t.currencyId;
                    form.elements.remarks.value = t.remarks || '';
                    document.getElementById('entry-mode-badge').textContent = 'Editing entry';
                    document.getElementById('update-btn').style.display = 'inline-flex';
                    document.getElementById('delete-btn').style.display = 'inline-flex';
                    form.querySelector('button[type=submit]').style.display = 'none';
                }, 0);
            }
            function updateEntry(module) {
                const form = document.getElementById('entry-form');
                if (!validateEntryForm(form, module)) { toast('Please complete all required fields correctly', 'error'); return; }
                const d = readEntryForm(form);
                const t = findById(DB.transactions, ENTRY_EDIT_ID);
                if (!t) return;
                Object.assign(t, {
                    date: d.date, direction: d.direction, description: d.description, bankId: d.bankId, refId: d.refId,
                    headId: module === 'income' ? d.refId : d.headId,
                    subCategoryId: module === 'expense' ? d.subCategoryId : undefined,
                    amount: d.amount, currencyId: d.currencyId, amountBase: toBase(d.amount, d.currencyId), remarks: d.remarks, updatedAt: new Date().toISOString()
                });
                save(); toast('Entry updated'); clearEntryForm(module); renderContent();
            }
            function deleteEntryFromForm() {
                if (!ENTRY_EDIT_ID) return;
                if (!confirmAction('Delete this transaction? This cannot be undone.')) return;
                DB.transactions = DB.transactions.filter(t => t.id !== ENTRY_EDIT_ID);
                save(); toast('Entry deleted'); renderContent();
            }
            function clearEntryForm(module) { ENTRY_EDIT_ID = null; renderContent(); }

            /* ================= FUND TRANSFER ================= */

                return `

            <input type="number" step="0.01" min="0" name="fromPartyAmount" placeholder="Defaults to the transfer amount"/></div>
          <div class="field"><label>Transfer To — Bank Account <span class="req">*</span></label>

                    const fromParty = t.fromPartyId ? findById(DB.masters.parties, t.fromPartyId) : null;

            function saveTransfer(ev) {
                ev.preventDefault();
                const f = ev.target;
                const date = f.elements.date.value, amount = round2(Number(f.elements.amount.value)),
                    fromBank = f.elements.fromBank.value, toBank = f.elements.toBank.value,
                    fromHeadId = f.elements.fromHeadId.value, toHeadId = f.elements.toHeadId.value,
                    fromPartyId = f.elements.fromPartyId.value, toPartyId = f.elements.toPartyId.value,
                    fromPartyAmountRaw = f.elements.fromPartyAmount.value, toPartyAmountRaw = f.elements.toPartyAmount.value,
                    charges = round2(Number(f.elements.charges.value || 0)), chargesCat = f.elements.chargesCat.value,
                    remarks = f.elements.remarks.value.trim();
                let valid = true;
                if (!date || !amount || amount <= 0 || !fromBank || !toBank || !fromHeadId || !toHeadId) { valid = false; }
                if (fromBank === toBank && fromHeadId === toHeadId) { toast('From and To must differ by account or head of account', 'error'); return false; }
                if (!valid) { toast('Please complete all required fields', 'error'); return false; }
                const baseCur = baseCurrency();
                const linkId = uid('lnk');
                const now = new Date().toISOString();
                const fromHeadName = findById(DB.masters.incomeHeads, fromHeadId).name;
                const toHeadName = findById(DB.masters.incomeHeads, toHeadId).name;
                DB.transactions.push({
                    id: uid('tx'), module: 'transfer', date, description: 'Fund Transfer to ' + esc(bankById(toBank).name) + ' (' + esc(toHeadName) + ')',
                    bankId: fromBank, refId: null, direction: 'debit', amount: amount, currencyId: baseCur.id, amountBase: amount,
                    fromHeadId, toHeadId, fromPartyId: fromPartyId || null, toPartyId: toPartyId || null, remarks, linkId, createdAt: now, updatedAt: now, createdBy: currentUserName()
                });
                DB.transactions.push({
                    id: uid('tx'), module: 'transfer', date, description: 'Fund Transfer from ' + esc(bankById(fromBank).name) + ' (' + esc(fromHeadName) + ')',
                    bankId: toBank, refId: null, direction: 'credit', amount: amount, currencyId: baseCur.id, amountBase: amount,
                    fromHeadId, toHeadId, fromPartyId: fromPartyId || null, toPartyId: toPartyId || null, remarks, linkId, createdAt: now, updatedAt: now, createdBy: currentUserName()
                });
                if (charges > 0) {
                    DB.transactions.push({
                        id: uid('tx'), module: 'expense', date, description: 'Transfer charges: ' + esc(bankById(fromBank).name) + ' → ' + esc(bankById(toBank).name),
                        bankId: fromBank, refId: chargesCat, headId: fromHeadId, subCategoryId: firstSubCatFor(chargesCat), direction: 'debit', amount: charges, currencyId: baseCur.id, amountBase: charges,
                        fromHeadId, toHeadId, remarks, linkId, createdAt: now, updatedAt: now, createdBy: currentUserName()
                    });
                }
                // "From 3rd Party" — the source side money is really borrowed: record a Loan
                // Taken (through the same bank + head already chosen) so it's tracked as a
                // liability and shows up correctly in the Loan Register and every dashboard
                // total, without double-moving cash (the transfer above already moved it).
                if (fromPartyId) {
                    const fromPartyAmount = round2(Number(fromPartyAmountRaw || 0)) || amount;
                    const party = findById(DB.masters.parties, fromPartyId);
                    const loanId = uid('loan');
                    DB.loans.push({
                        id: loanId, partyId: fromPartyId, kind: 'taken', headId: fromHeadId, principal: fromPartyAmount, outstanding: fromPartyAmount,
                        interestRate: null, startDate: date, remarks: 'Linked to fund transfer to ' + esc(bankById(toBank).name) + (remarks ? (' — ' + remarks) : ''), status: 'Active'
                    });
                    DB.transactions.push({
                        id: uid('tx'), module: 'loan_taken', date, description: 'Loan taken from ' + esc(party.name) + ' (via fund transfer)',
                        bankId: fromBank, refId: loanId, headId: fromHeadId, direction: 'credit', amount: fromPartyAmount, currencyId: baseCur.id, amountBase: fromPartyAmount,
                        remarks, linkId, createdAt: now, updatedAt: now, createdBy: currentUserName()
                    });
                }
                // "To 3rd Party" — the destination side money is really being lent onward:
                // record a Loan Given the same way.
                if (toPartyId) {
                    const toPartyAmount = round2(Number(toPartyAmountRaw || 0)) || amount;
                    const party = findById(DB.masters.parties, toPartyId);
                    const loanId = uid('loan');
                    DB.loans.push({
                        id: loanId, partyId: toPartyId, kind: 'given', headId: toHeadId, principal: toPartyAmount, outstanding: toPartyAmount,
                        interestRate: null, startDate: date, remarks: 'Linked to fund transfer from ' + esc(bankById(fromBank).name) + (remarks ? (' — ' + remarks) : ''), status: 'Active'
                    });
                    DB.transactions.push({
                        id: uid('tx'), module: 'loan_given', date, description: 'Loan given to ' + esc(party.name) + ' (via fund transfer)',
                        bankId: toBank, refId: loanId, headId: toHeadId, direction: 'debit', amount: toPartyAmount, currencyId: baseCur.id, amountBase: toPartyAmount,
                        remarks, linkId, createdAt: now, updatedAt: now, createdBy: currentUserName()
                    });
                }
                save(); toast('Transfer saved'); renderContent();
                return false;
            }

            /* ================= TRANSACTION REGISTER ================= */
            // One consolidated, filterable ledger covering every entry segment
            // (Income, Expense, Savings/Investment, Fund Transfers, Loans & Borrowings)
            // with a running Opening -> Closing balance, oldest entry first.
            const TX_TYPE_GROUPS = [
                ['income', 'Income', ['income']],
                ['expense', 'Expense', ['expense']],
                ['investment', 'Savings/Investment', ['investment_out', 'investment_in']],
                ['transfer', 'Fund Transfers', ['transfer']],
                ['loan', 'Loans & Borrowings', ['loan_taken', 'loan_given', 'loan_repay', 'loan_collect']]
            ];
            function txTypeLabel(t) {
                if (t.module === 'opening_balance') return 'Opening Balance';
                const grp = TX_TYPE_GROUPS.find(g => g[2].includes(t.module));
                return grp ? grp[1] : moduleLabel(t);
            }
            function categoryLabelFor(t) {
                if (t.module === 'income') return findById(DB.masters.incomeHeads, t.refId)?.name || '—';
                if (t.module === 'expense') return findById(DB.masters.expenseCategories, t.refId)?.name || '—';
                if (t.module === 'transfer') return 'Transfer (' + esc(findById(DB.masters.incomeHeads, t.direction === 'debit' ? t.fromHeadId : t.toHeadId)?.name || '—') + ')';
                if (t.module === 'investment_out' || t.module === 'investment_in') {
                    const inv = findById(DB.investments, t.refId);
                    return inv ? findById(DB.masters.investmentTypes, inv.investmentTypeId)?.name : 'Investment';
                }
                if (t.module === 'loan_taken' || t.module === 'loan_repay' || t.module === 'loan_given' || t.module === 'loan_collect') {
                    const loan = findById(DB.loans, t.refId);
                    return loan ? 'Loan: ' + (findById(DB.masters.parties, loan.partyId)?.name || '') : 'Loan';
                }
                if (t.module === 'opening_balance') return 'Opening Balance';
                return '—';
            }
            // Resolve the Income Head ("Source of Income" / Head of Account) for ANY row,
            // whichever segment it came from — this is what makes bank+source analysis possible.
            function headNameForRow(t) {
                let headId = null;
                if (t.module === 'income') headId = t.refId;
                else if (t.module === 'expense') headId = t.headId;
                else if (t.module === 'transfer') headId = t.direction === 'debit' ? t.fromHeadId : t.toHeadId;
                else if (t.module === 'investment_out' || t.module === 'investment_in') headId = t.headId;
                else if (t.module === 'loan_taken' || t.module === 'loan_given' || t.module === 'loan_repay' || t.module === 'loan_collect') headId = t.headId;
                else if (t.module === 'opening_balance') headId = t.headId;
                if (!headId) return '—';
                return findById(DB.masters.incomeHeads, headId)?.name || '—';
            }
            function riskNameForInvTx(t) {
                const inv = findById(DB.investments, t.refId);
                return inv ? (findById(DB.masters.riskCategories, inv.riskCategoryId)?.name || '—') : '—';
            }
            function mainCatNameForRow(t) {
                return t.module === 'expense' ? (findById(DB.masters.expenseCategories, t.refId)?.name || '—') : '';
            }
            function subCatNameForRow(t) {
                return t.module === 'expense' ? (findById(DB.masters.expenseSubCategories, t.subCategoryId)?.name || '—') : '';
            }
            // Chronological, oldest-first, with a running Opening Balance -> Closing Balance
            // on every row, honoring whatever filters are active.
            function getRegisterRows() {
                const s = REGISTER_STATE;
                const showReal = s.type !== 'openingbalance';
                const showSynthetic = !s.type || s.type === 'openingbalance';

                let rows = [];
                if (showReal) {
                    rows = [...DB.transactions];
                    if (s.type) {
                        const grp = TX_TYPE_GROUPS.find(g => g[0] === s.type);
                        if (grp) rows = rows.filter(t => grp[2].includes(t.module));
                    }
                    if (s.bank) rows = rows.filter(t => t.bankId === s.bank);
                    if (s.head) rows = rows.filter(t => {
                        if (t.module === 'income') return t.refId === s.head;
                        if (t.module === 'expense' || t.module === 'investment_out' || t.module === 'investment_in' ||
                            t.module === 'loan_taken' || t.module === 'loan_given' || t.module === 'loan_repay' || t.module === 'loan_collect') return t.headId === s.head;
                        if (t.module === 'transfer') return t.fromHeadId === s.head || t.toHeadId === s.head;
                        return false;
                    });
                    if (s.mainCat) rows = rows.filter(t => t.module === 'expense' && t.refId === s.mainCat);
                    if (s.subCat) rows = rows.filter(t => t.module === 'expense' && t.subCategoryId === s.subCat);
                    if (s.search) {
                        const q = s.search.toLowerCase();
                        rows = rows.filter(t => (t.description || '').toLowerCase().includes(q) || (t.remarks || '').toLowerCase().includes(q));
                    }
                    if (s.from) rows = rows.filter(t => t.date >= s.from);
                    if (s.to) rows = rows.filter(t => t.date <= s.to);
                }

                // One visible "Opening Balance" line per Bank x Source-of-Income combination
                // that has a non-zero opening balance — dated on its As On Date, with Credit
                // and Debit explicitly shown as zero rather than left blank.
                let synthRows = [];
                if (showSynthetic && !s.mainCat && !s.subCat) {
                    Object.keys(DB.openingBalances || {}).forEach(key => {
                        const entry = DB.openingBalances[key];
                        if (!entry || !Number(entry.amount)) return;
                        const [bankId, headId] = key.split('|');
                        if (s.bank && s.bank !== bankId) return;
                        if (s.head && s.head !== headId) return;
                        const bank = bankById(bankId), head = findById(DB.masters.incomeHeads, headId);
                        if (!bank || !head) return;
                        const date = entry.asOnDate || todayStr();
                        if (s.from && date < s.from) return;
                        if (s.to && date > s.to) return;
                        if (s.search && !'opening balance'.includes(s.search.toLowerCase())) return;
                        synthRows.push({
                            id: 'ob-' + key, module: 'opening_balance', isSynthetic: true,
                            date, description: 'Opening Balance', remarks: '',
                            bankId, headId, refId: headId, currencyId: baseCurrency().id,
                            _obAmount: round2(Number(entry.amount || 0))
                        });
                    });
                }

                rows = [...rows, ...synthRows];
                // earliest entries at top, latest at bottom; a same-day Opening Balance line
                // always sorts ahead of that day's real transactions
                rows.sort((a, b) => {
                    const ak = a.date + (a.isSynthetic ? '0' : a.createdAt);
                    const bk = b.date + (b.isSynthetic ? '0' : b.createdAt);
                    return ak.localeCompare(bk);
                });
                let bal = 0;
                return rows.map(t => {
                    if (t.isSynthetic) {
                        // A declared Opening Balance sets the balance itself — show it in both
                        // columns rather than "0 before / amount after", so the figure the user
                        // entered is always visible, not just implied by the Closing column.
                        bal = round2(bal + t._obAmount);
                        return { ...t, opening: bal, closing: bal };
                    }
                    const opening = round2(bal);
                    bal = round2(bal + (t.direction === 'credit' ? t.amountBase : -t.amountBase));
                    return { ...t, opening, closing: round2(bal) };
                });
            }
            function paginate(rows, state) {

            }
            function subCatFilterOptions() {

            }
            function viewRegister() {
                const s = REGISTER_STATE;
                const rows = getRegisterRows();
                const { pageRows } = paginate(rows, s);
                return `

      </select>

        <option value="">All Sources</option>

      </select>
      <select onchange="PFL.setRegMainCat(this.value)" title="Main Category of Expense">
        <option value="">All Main Categories</option>
        ${DB.masters.expenseCategories.map(c => `<option value="${c.id}" ${s.mainCat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
      </select>
      <select onchange="PFL.setRegFilter('subCat',this.value)" title="Sub Category of Expense">
        <option value="">All Sub Categories</option>
        ${subCatFilterOptions().map(sc => `<option value="${sc.id}" ${s.subCat === sc.id ? 'selected' : ''}>${esc(sc.name)}</option>`).join('')}
      </select>
      <input type="text" placeholder="Search description / remarks…" value="${esc(s.search)}" oninput="PFL.setRegFilter('search',this.value)" style="min-width:180px;"/>
      <input type="date" value="${s.from}" onchange="PFL.setRegFilter('from',this.value)" title="From date"/>
      <input type="date" value="${s.to}" onchange="PFL.setRegFilter('to',this.value)" title="To date"/>
      <button class="btn btn-ghost btn-sm" onclick="PFL.resetRegFilters()">Reset</button>
      <label class="freeze-toggle"><input type="checkbox" ${s.freezeHead ? 'checked' : ''} onchange="PFL.toggleRegFreeze('freezeHead')"/> Freeze header</label>
      <label class="freeze-toggle"><input type="checkbox" ${s.freezeCols ? 'checked' : ''} onchange="PFL.toggleRegFreeze('freezeCols')"/> Freeze Sl.No/Date</label>
      <span style="flex:1;"></span>
      <button class="btn btn-ghost btn-sm" onclick="PFL.exportRegisterExcel()">⇩ Excel</button>
      <button class="btn btn-ghost btn-sm" onclick="PFL.exportRegisterPDF()">⇩ PDF</button>
      <button class="btn btn-ghost btn-sm" onclick="window.print()">⎙ Print</button>
    </div>
    ${rows.length ? `<div class="table-wrap ${s.freezeHead ? 'freeze-head' : ''} ${s.freezeCols ? 'freeze-cols' : ''}" style="border:none;border-radius:0;"><table id="register-table">
      <thead><tr>
        <th class="frozen-col">Sl.No.</th>
        <th class="frozen-col">Date</th>
        <th>Type of Transaction</th>
        <th>Name of the Bank</th>
        <th>Source of Income</th>
        <th>Main Category</th>
        <th>Sub Category</th>
        <th style="text-align:right;">Opening Balance</th>
        <th style="text-align:right;">Credit</th>
        <th style="text-align:right;">Debit</th>
        <th style="text-align:right;">Closing Balance</th>
        <th class="wrap">Description / Notes / Remarks</th>
        <th class="no-print">Actions</th>
      </tr></thead>
      <tbody>${pageRows.map((t, idx) => `<tr>
        <td class="frozen-col">${(s.page - 1) * s.pageSize + idx + 1}</td>
        <td class="frozen-col">${fmtDate(t.date)}</td>
        <td><span class="badge">${txTypeLabel(t)}</span></td>
        <td>${esc(bankById(t.bankId)?.name || '—')}</td>
        <td>${esc(headNameForRow(t))}</td>

        <td>${esc(subCatNameForRow(t)) || '—'}</td>
        <td class="num" style="text-align:right;">₹${fmt2(t.opening)}</td>
        <td class="num credit" style="text-align:right;">${t.isSynthetic ? '₹0.00' : (t.direction === 'credit' ? '₹' + fmt2(t.amountBase) : '')}</td>
        <td class="num debit" style="text-align:right;">${t.isSynthetic ? '₹0.00' : (t.direction === 'debit' ? '₹' + fmt2(t.amountBase) : '')}</td>
        <td class="num" style="text-align:right;${t.closing < 0 ? 'color:var(--rust)' : ''}">₹${fmt2(t.closing)}</td>
        <td class="wrap">${esc(t.description || t.remarks || '—')}</td>
        <td class="no-print"><div class="row-actions">
          ${t.isSynthetic ? `<button class="btn btn-sm btn-ghost" onclick="PFL.go('income') && PFL.setIncomeSubTab('subledger')">Edit</button>` :
                        ((t.module === 'income' || t.module === 'expense') ? `<button class="btn btn-sm btn-ghost" onclick="PFL.editEntry('${t.module}','${t.id}')">Edit</button>` : '')
                        + `<button class="btn btn-sm btn-ghost" style="color:var(--rust);" onclick="PFL.deleteTransaction('${t.id}')">Delete</button>`}
        </div></td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="table-foot no-print">
      <div>Showing ${Math.min((s.page - 1) * s.pageSize + 1, rows.length)}–${Math.min(s.page * s.pageSize, rows.length)} of ${rows.length} transactions (oldest first)</div>
      <div class="pager">
        <button ${s.page <= 1 ? 'disabled' : ''} onclick="PFL.setRegPage(${s.page - 1})">‹ Prev</button>
        <span>Page ${s.page} of ${Math.max(1, Math.ceil(rows.length / s.pageSize))}</span>
        <button ${s.page * s.pageSize >= rows.length ? 'disabled' : ''} onclick="PFL.setRegPage(${s.page + 1})">Next ›</button>
      </div>
    </div>`
                        : emptyState('No transactions match your filters', 'Try clearing filters, or record a new entry from the Entries menu.')}
  </div>`;
            }
            function setRegFilter(k, v) { REGISTER_STATE[k] = v; REGISTER_STATE.page = 1; renderContent(); }
            function setRegMainCat(v) { REGISTER_STATE.mainCat = v; REGISTER_STATE.subCat = ''; REGISTER_STATE.page = 1; renderContent(); }
            function resetRegFilters() { REGISTER_STATE = { search: '', bank: '', type: '', head: '', mainCat: '', subCat: '', from: '', to: '', page: 1, pageSize: 20, freezeHead: REGISTER_STATE.freezeHead, freezeCols: REGISTER_STATE.freezeCols }; renderContent(); }
            function toggleRegFreeze(key) { REGISTER_STATE[key] = !REGISTER_STATE[key]; renderContent(); }
            function setRegPage(p) { REGISTER_STATE.page = p; renderContent(); }
            function deleteTransaction(id) {
                const t = findById(DB.transactions, id);
                if (!t) return;
                let group = [t];
                if (t.linkId) group = DB.transactions.filter(x => x.linkId === t.linkId);
                const msg = group.length > 1
                    ? 'This entry is linked to ' + (group.length - 1) + ' other transaction(s) (e.g. a transfer or loan payment). Deleting will remove all linked rows and reverse their effect. Continue?'
                    : 'Delete this transaction? This cannot be undone.';
                if (!confirmAction(msg)) return;
                group.forEach(g => {
                    if (g.module === 'investment_out') {
                        const inv = findById(DB.investments, g.refId);
                        if (inv) { DB.investments = DB.investments.filter(i => i.id !== inv.id); }
                    }
                    if (g.module === 'investment_in') {
                        const inv = findById(DB.investments, g.refId);
                        if (inv) { inv.currentValue = round2(inv.currentValue + g.amountBase); inv.status = 'Active'; }
                    }
                    if ((g.module === 'loan_taken' || g.module === 'loan_given')) {
                        const loan = findById(DB.loans, g.refId);
                        if (loan) { DB.loans = DB.loans.filter(l => l.id !== loan.id); }
                    }
                    if (g.module === 'loan_repay' || g.module === 'loan_collect') {
                        const loan = findById(DB.loans, g.refId);
                        if (loan) { loan.outstanding = round2(loan.outstanding + g.amountBase); loan.status = 'Active'; }
                    }
                });
                const ids = new Set(group.map(g => g.id));
                DB.transactions = DB.transactions.filter(x => !ids.has(x.id));
                save(); toast('Transaction deleted'); renderContent();
            }
            function currentRegisterTableData() {
                const table = document.getElementById('register-table');
                if (!table) return null;
                const headers = [...table.querySelectorAll('thead th')].filter(th => !th.classList.contains('no-print')).map(th => th.textContent);
                const body = [...table.querySelectorAll('tbody tr')].map(tr => [...tr.children].filter(td => !td.classList.contains('no-print')).map(td => td.textContent.trim()));

            function exportRegisterExcel() {
                const d = currentRegisterTableData();

                const ws = XLSX.utils.aoa_to_sheet([d.headers, ...d.body]);

            // Robust date parsing: JS Date object (from cellDates), Excel serial number, or common string formats.
            function parseImportDate(v) {

                if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
                if (typeof v === 'number') {

                    if (!isNaN(d)) return d.toISOString().slice(0, 10);
                }
                const s = String(v).trim();
                let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); // DD/MM/YYYY
                if (m) { const dd = +m[1], mm = +m[2], yy = +m[3]; if (mm <= 12 && dd <= 31) { const d = new Date(yy, mm - 1, dd); if (!isNaN(d)) return d.toISOString().slice(0, 10); } }
                m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/); // YYYY-MM-DD

            // Parses ALL rows using the current mapping (used for both preview and commit).
            function parseImportRows() {
                const m = IMPORT_STATE.mapping;

                    credCol = colIndex(m.credit), debCol = colIndex(m.debit), amtCol = colIndex(m.amount), typeCol = colIndex(m.type),

            function commitImport() {
                const rows = parseImportRows().filter(p => p.valid);
                if (!rows.length) { toast('Nothing valid to import — check the mapping above', 'error'); return; }
                const baseCur = baseCurrency();
                let income = 0, expense = 0, skipped = 0;
                rows.forEach(p => {
                    const bankId = findOrCreateBank(p.bankName);
                    if (!bankId) { skipped++; return; }
                    const currencyId = p.currencyCode ? findCurrency(p.currencyCode) : baseCur.id;
                    const now = new Date().toISOString();
                    if (p.direction === 'credit') {
                        const headId = findOrCreateIncomeHead(p.category || 'Other Income');
                        DB.transactions.push({
                            id: uid('tx'), module: 'income', date: p.date, description: p.description, bankId, refId: headId,
                            headId, direction: 'credit', amount: p.amount, currencyId, amountBase: toBase(p.amount, currencyId),
                            remarks: p.remarks, createdAt: now, updatedAt: now, createdBy: 'Import'
                        });
                        income++;
                    } else {
                        const catInfo = findOrCreateExpenseCategory(p.category || 'Other', p.subCategory);
                        if (!catInfo) { skipped++; return; }
                        const headId = p.headName ? findOrCreateIncomeHead(p.headName) : 'ih-other';
                        DB.transactions.push({
                            id: uid('tx'), module: 'expense', date: p.date, description: p.description, bankId, refId: catInfo.catId,
                            headId, subCategoryId: catInfo.subCatId, direction: 'debit', amount: p.amount, currencyId, amountBase: toBase(p.amount, currencyId),
                            remarks: p.remarks, createdAt: now, updatedAt: now, createdBy: 'Import'
                        });
                        expense++;
                    }
                });
                const totalSkipped = skipped + (parseImportRows().length - rows.length);
                IMPORT_STATE.result = { income, expense, skipped: totalSkipped };
                save();
                toast('Import complete');
                renderContent();
            }

                });
                const rows = Object.entries(contributors).sort((a, b) => b[1].count - a[1].count);

            function mergeImportFile(ev) {
                const file = ev.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const incoming = JSON.parse(e.target.result);
                        if (!incoming.masters || !incoming.transactions) throw new Error('invalid file');
                        const summary = mergeIncomingData(incoming);
                        save();
                        document.getElementById('merge-result').innerHTML = `
        <div class="card card-pad" style="margin-top:14px;border-top-color:var(--sage);">
          <div class="panel-head"><h3>Merge complete</h3></div>
          <p>Added <b>${summary.tx}</b> new transaction${summary.tx === 1 ? '' : 's'}, <b>${summary.inv}</b> new investment${summary.inv === 1 ? '' : 's'}, <b>${summary.loan}</b> new loan${summary.loan === 1 ? '' : 's'}, and <b>${summary.masters}</b> new master ${summary.masters === 1 ? 'entry' : 'entries'} (banks/categories/heads/etc.). Skipped <b>${summary.skipped}</b> already-present record${summary.skipped === 1 ? '' : 's'}.</p>
        </div>`;
                        toast('Merge complete');
                        ev.target.value = '';
                        renderContent();
                    } catch (err) {
                        toast('Could not read that file — is it a Personal Finance Ledger backup?', 'error');
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            }
            // Additive-only merge: never overwrites or removes anything already present.
            // Records are matched by id, so merging the same export twice is harmless.
            function mergeIncomingData(incoming) {
                let txAdded = 0, invAdded = 0, loanAdded = 0, mastersAdded = 0, skipped = 0;
                const existingTxIds = new Set(DB.transactions.map(t => t.id));
                (incoming.transactions || []).forEach(t => {
                    if (existingTxIds.has(t.id)) { skipped++; return; }
                    DB.transactions.push(t); existingTxIds.add(t.id); txAdded++;
                });
                const existingInvIds = new Set(DB.investments.map(i => i.id));
                (incoming.investments || []).forEach(i => {
                    if (existingInvIds.has(i.id)) { skipped++; return; }
                    DB.investments.push(i); existingInvIds.add(i.id); invAdded++;
                });
                const existingLoanIds = new Set(DB.loans.map(l => l.id));
                (incoming.loans || []).forEach(l => {
                    if (existingLoanIds.has(l.id)) { skipped++; return; }
                    DB.loans.push(l); existingLoanIds.add(l.id); loanAdded++;
                });
                const masterKeys = ['banks', 'incomeHeads', 'expenseCategories', 'expenseSubCategories', 'currencies', 'investmentTypes', 'parties', 'riskCategories'];
                masterKeys.forEach(k => {
                    if (!Array.isArray(incoming.masters?.[k])) return;
                    if (!Array.isArray(DB.masters[k])) DB.masters[k] = [];
                    const existingIds = new Set(DB.masters[k].map(m => m.id));
                    const existingNames = new Set(DB.masters[k].map(m => (m.name || '').toLowerCase()));
                    incoming.masters[k].forEach(m => {
                        if (existingIds.has(m.id) || (m.name && existingNames.has(m.name.toLowerCase()))) { skipped++; return; }
                        DB.masters[k].push(m); existingIds.add(m.id); mastersAdded++;
                    });
                });
                if (incoming.openingBalances) {
                    if (!DB.openingBalances) DB.openingBalances = {};
                    Object.keys(incoming.openingBalances).forEach(key => {
                        if (DB.openingBalances[key]) { skipped++; return; } // don't clobber an existing opening balance
                        DB.openingBalances[key] = incoming.openingBalances[key];
                    });
                }
                return { tx: txAdded, inv: invAdded, loan: loanAdded, masters: mastersAdded, skipped };
            }

            function viewBackup() {
