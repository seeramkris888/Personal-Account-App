<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Ledger Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        /* ============ DESIGN TOKENS — "LEDGER" IDENTITY ============
   Deep ledger-ink green + traditional red/black bookkeeping ink,
   brass hardware accents, paper surface. Serif for headers (bound-ledger
   feel), grotesk for UI, mono tabular figures for every number.
============================================================== */
        :root {
            --ink: #132A22;
            --ink-2: #1F3A30;
            --paper: #FBFAF5;
            --paper-dim: #F1EDE1;
            --paper-card: #FFFFFF;
            --brass: #A9832E;
            --brass-soft: #DCC48A;
            --rust: #9C3B34;
            --sage: #3E6E56;
            --slate: #5B6660;
            --line: #E4DECC;
            --shadow: 0 6px 24px rgba(19, 42, 34, .08);
            --shadow-sm: 0 2px 8px rgba(19, 42, 34, .06);
            --radius: 14px;
            --radius-sm: 9px;
            --font-display: 'Source Serif 4', Georgia, serif;
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --sidebar-w: 248px;
        }

        html[data-theme="dark"] {
            --ink: #EDEAE0;
            --ink-2: #CFCBBB;
            --paper: #0E1613;
            --paper-dim: #161F1A;
            --paper-card: #182420;
            --brass: #D2B15E;
            --brass-soft: #7A6738;
            --rust: #D3776E;
            --sage: #6FA88C;
            --slate: #93A199;
            --line: #243029;
            --shadow: 0 6px 24px rgba(0, 0, 0, .45);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: var(--font-body);
            background: var(--paper);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            transition: background .25s ease, color .25s ease;
        }

        ::selection {
            background: var(--brass-soft);
            color: var(--ink);
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: var(--font-display);
            font-weight: 600;
            margin: 0;
            letter-spacing: .2px;
        }

        .num {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        .credit {
            color: var(--sage);
        }

        .debit {
            color: var(--rust);
        }

        a {
            color: inherit;
        }

        button {
            font-family: var(--font-body);
            cursor: pointer;
        }

        input,
        select,
        textarea {
            font-family: var(--font-body);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ---------- Layout shell ---------- */
        #app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--ink);
            color: var(--paper);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .brand {
            padding: 22px 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
        }

        .brand .mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: 1.5px solid var(--brass-soft);
            border-radius: 8px;
            color: var(--brass-soft);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .brand h1 {
            font-size: 17px;
            color: var(--paper);
            line-height: 1.25;
        }

        .brand .sub {
            font-size: 10.5px;
            color: var(--brass-soft);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .nav {
            padding: 14px 10px;
            flex: 1;
        }

        .nav-group {
            margin-bottom: 6px;
        }

        .nav-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: rgba(251, 250, 245, .4);
            padding: 14px 12px 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            color: rgba(251, 250, 245, .78);
            cursor: pointer;
            margin-bottom: 2px;
            border-left: 3px solid transparent;
            transition: background .15s, color .15s;
            user-select: none;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, .06);
            color: var(--paper);
        }

        .nav-item.active {
            background: rgba(255, 255, 255, .09);
            color: var(--paper);
            border-left: 3px solid var(--brass);
        }

        .nav-item .ic {
            width: 16px;
            text-align: center;
            font-size: 14px;
            opacity: .9;
        }

        .sidebar-foot {
            padding: 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, .12);
            font-size: 10.5px;
            color: rgba(251, 250, 245, .45);
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 26px;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            gap: 14px;
        }

        .topbar .title h2 {
            font-size: 20px;
        }

        .topbar .title .crumb {
            font-size: 12px;
            color: var(--slate);
            margin-top: 2px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content {
            padding: 22px 26px 60px;
            flex: 1;
        }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: var(--paper-card);
            color: var(--ink);
            font-size: 13.5px;
            font-weight: 600;
            transition: all .15s;
        }

        .btn:hover {
            border-color: var(--brass);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        .btn-primary:hover {
            background: var(--ink-2);
        }

        .btn-brass {
            background: var(--brass);
            color: #fff;
            border-color: var(--brass);
        }

        .btn-brass:hover {
            filter: brightness(1.06);
        }

        .btn-danger {
            color: var(--rust);
            border-color: var(--rust);
            background: transparent;
        }

        .btn-danger:hover {
            background: var(--rust);
            color: #fff;
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
        }

        .btn-ghost:hover {
            background: var(--paper-dim);
            border-color: var(--line);
        }

        .btn-sm {
            padding: 6px 11px;
            font-size: 12px;
            border-radius: 7px;
        }

        .btn-icon {
            padding: 8px;
            width: 34px;
            height: 34px;
            justify-content: center;
        }

        .icon-toggle {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            background: var(--paper-card);
            font-size: 16px;
        }

        .icon-toggle:hover {
            border-color: var(--brass);
        }

        /* ---------- Cards / KPI ---------- */
        .grid {
            display: grid;
            gap: 16px;
        }

        .grid-auto {
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        }

        .grid-5 {
            grid-template-columns: repeat(5, 1fr);
        }

        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        @media(max-width:1200px) {
            .grid-5 {
                grid-template-columns: repeat(3, 1fr);
            }

            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }

            .grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:720px) {

            .grid-5,
            .grid-4,
            .grid-3,
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--paper-card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .card.kpi {
            padding: 18px 20px;
            border-top: 3px solid var(--brass);
        }

        .card.kpi .lbl {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--slate);
            font-weight: 600;
        }

        .card.kpi .val {
            font-family: var(--font-mono);
            font-size: 23px;
            font-weight: 600;
            margin-top: 8px;
            letter-spacing: -.3px;
        }

        .card.kpi .sub {
            font-size: 11.5px;
            color: var(--slate);
            margin-top: 5px;
        }

        .card-pad {
            padding: 20px 22px;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .panel-head h3 {
            font-size: 16px;
        }

        /* ---------- Forms ---------- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px 16px;
        }

        @media(max-width:720px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full {
            grid-column: 1/-1;
        }

        .field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--slate);
        }

        .field .req {
            color: var(--rust);
        }

        .field input,
        .field select,
        .field textarea {
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--paper-card);
            color: var(--ink);
            font-size: 13.5px;
            outline: none;
            transition: border-color .15s;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--brass);
        }

        .field .err {
            font-size: 11.5px;
            color: var(--rust);
            min-height: 14px;
        }

        .field input.invalid,
        .field select.invalid {
            border-color: var(--rust);
        }

        .field textarea {
            resize: vertical;
            min-height: 56px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .hint {
            font-size: 11.5px;
            color: var(--slate);
            margin-top: 2px;
        }

        .pill {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 600;
        }

        .pill.on {
            background: rgba(62, 110, 86, .14);
            color: var(--sage);
        }

        .pill.off {
            background: rgba(156, 59, 52, .12);
            color: var(--rust);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 600;
            background: var(--paper-dim);
            color: var(--slate);
            border: 1px solid var(--line);
        }

        /* ---------- Tables ---------- */
        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--paper-card);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            background: var(--paper-dim);
            text-align: left;
            padding: 10px 12px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--slate);
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
            cursor: pointer;
        }

        thead th:hover {
            color: var(--ink);
        }

        tbody td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: var(--paper-dim);
        }

        tbody tr:hover {
            background: var(--brass-soft);
            background: color-mix(in srgb, var(--brass-soft) 25%, transparent);
        }

        tbody td.wrap {
            white-space: normal;
            min-width: 160px;
        }

        .row-actions {
            display: flex;
            gap: 6px;
        }

        .table-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }

        .table-toolbar input,
        .table-toolbar select {
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 12.5px;
            background: var(--paper);
            color: var(--ink);
        }

        .table-toolbar label.freeze-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--slate);
            cursor: pointer;
            user-select: none;
        }

        .table-toolbar label.freeze-toggle input {
            width: auto;
            padding: 0;
        }

        /* Freeze header: bound the table to a scrollable box so the sticky header has
   real effect, independent of the page's own scroll / the sticky topbar. */
        .table-wrap.freeze-head {
            max-height: 66vh;
            overflow-y: auto;
        }

        .table-wrap.freeze-head thead th {
            position: sticky;
            top: 0;
            z-index: 4;
        }

        /* Freeze columns: left-most column(s) stay put while scrolling horizontally.
   Actual left-offset and per-row background are computed in JS (afterRender)
   since column widths vary by content. */
        .table-wrap.freeze-cols td.frozen-col,
        .table-wrap.freeze-cols th.frozen-col {
            position: sticky;
            z-index: 3;
        }

        .table-wrap.freeze-cols thead th.frozen-col {
            z-index: 6;
        }

        .table-wrap.freeze-cols td.frozen-col.frozen-edge,
        .table-wrap.freeze-cols th.frozen-col.frozen-edge {
            box-shadow: 3px 0 6px rgba(19, 42, 34, .10);
        }

        .table-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 12px;
            color: var(--slate);
        }

        .pager {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .pager button {
            padding: 5px 10px;
            border: 1px solid var(--line);
            background: var(--paper-card);
            border-radius: 6px;
            font-size: 12px;
        }

        .pager button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .pager button.active {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        /* ---------- Empty state ---------- */
        .empty {
            padding: 52px 20px;
            text-align: center;
            color: var(--slate);
        }

        .empty .glyph {
            font-family: var(--font-display);
            font-size: 34px;
            color: var(--brass-soft);
            margin-bottom: 10px;
        }

        .empty .msg {
            font-size: 13.5px;
            max-width: 340px;
            margin: 0 auto;
        }

        /* ---------- Modal ---------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(19, 42, 34, .45);
            backdrop-filter: blur(2px);
            z-index: 100;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 5vh 16px;
            overflow-y: auto;
        }

        .modal {
            background: var(--paper-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 560px;
            padding: 24px 26px;
            border-top: 4px solid var(--brass);
            animation: pop .15s ease;
        }

        .modal.wide {
            max-width: 720px;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-head h3 {
            font-size: 17px;
        }

        /* ---------- Toast ---------- */
        #toast-host {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 11px 16px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: var(--shadow);
            color: #fff;
            background: var(--sage);
            animation: slidein .2s ease;
            min-width: 200px;
        }

        .toast.error {
            background: var(--rust);
        }

        .toast.info {
            background: var(--ink);
        }

        @keyframes slidein {
            from {
                opacity: 0;
                transform: translateX(14px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ---------- Tabs ---------- */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--paper-dim);
            padding: 4px;
            border-radius: 10px;
            width: fit-content;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 14px;
            border-radius: 7px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--slate);
            cursor: pointer;
        }

        .tab.active {
            background: var(--paper-card);
            color: var(--ink);
            box-shadow: var(--shadow-sm);
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--slate);
            font-weight: 700;
            margin: 26px 0 10px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 18px 0;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-dot.active {
            background: var(--sage);
        }

        .status-dot.inactive {
            background: var(--rust);
        }

        /* ---------- Currency chip ---------- */
        .curr-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--paper-dim);
            font-family: var(--font-mono);
            font-size: 11px;
            border: 1px solid var(--line);
        }

        /* Mobile sidebar */
        .menu-btn {
            display: none;
        }

        @media(max-width:920px) {
            .sidebar {
                position: fixed;
                left: -260px;
                z-index: 90;
                transition: left .2s ease;
                box-shadow: var(--shadow);
            }

            .sidebar.open {
                left: 0;
            }

            .menu-btn {
                display: flex;
            }

            .content {
                padding: 16px;
            }

            .topbar {
                padding: 12px 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            z-index: 80;
        }

        .sidebar-overlay.show {
            display: block;
        }

        @media print {

            .sidebar,
            .topbar,
            .no-print,
            .table-toolbar,
            .table-foot,
            .row-actions {
                display: none !important;
            }

            .content {
                padding: 0;
            }

            body {
                background: #fff;
                color: #000;
            }

            .table-wrap {
                border: none;
            }

            thead th {
                position: static;
            }

            .table-wrap.freeze-head {
                max-height: none;
                overflow: visible;
            }

            .table-wrap.freeze-head thead th {
                position: static;
            }

            .table-wrap.freeze-cols td.frozen-col,
            .table-wrap.freeze-cols th.frozen-col {
                position: static;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="toast-host"></div>
    <script>

        /* ==================================================================
           PERSONAL FINANCE LEDGER PRO — application script
           ================================================================== */
        (function () {
            "use strict";

            /* ---------------- utils ---------------- */
            function uid(p) { return (p || 'id') + '-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
            function todayStr() { return new Date().toISOString().slice(0, 10); }
            function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
            function round2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
            function fmt2(n) { n = round2(n || 0); return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
            // Indian-style grouping for the base currency display
            function fmtINR(n) {
                n = round2(n || 0);
                let neg = n < 0; n = Math.abs(n);
                let [int, dec] = n.toFixed(2).split('.');
                let last3 = int.slice(-3), rest = int.slice(0, -3);
                if (rest !== '') last3 = ',' + last3;
                let grouped = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
                return (neg ? '-' : '') + grouped + '.' + dec;
            }
            function fmtDate(d) {
                if (!d) return '';
                const dt = new Date(d + 'T00:00:00');
                if (isNaN(dt)) return d;
                const dd = String(dt.getDate()).padStart(2, '0');
                const mm = String(dt.getMonth() + 1).padStart(2, '0');

            function monthLabel(k) {
                if (!k) return '';
                const [y, m] = k.split('-');

                return names[parseInt(m, 10) - 1] + ' ' + y;

            function debounce(fn, ms) { let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); }; }
            function downloadBlob(content, filename, type) {

            /* ---------------- storage adapter (works inside Claude.ai AND as a standalone file) ----------------
               Claude.ai's artifact runtime injects window.storage, but a downloaded copy
               of this file opened directly in a phone/desktop browser has NO such API —
               so every call below tries window.storage first and transparently falls
               back to a real local IndexedDB database when it isn't available. Either
               way, saving on a given device is now guaranteed to work. Whether it's also
               SHARED with other devices depends on window.storage's shared mode actually
               bridging separate devices/logins, which isn't guaranteed — see the Family
               Sync page for the honest picture and the reliable Export + Merge workflow. */
            const HAS_CLAUDE_STORAGE = (typeof window !== 'undefined' && !!window.storage);
            const STORAGE_MODE = HAS_CLAUDE_STORAGE ? 'claude' : 'local';
            let _idbPromise = null;
            function idbOpen() {
                if (_idbPromise) return _idbPromise;
                _idbPromise = new Promise((resolve, reject) => {
                    if (!('indexedDB' in window)) { reject(new Error('IndexedDB not available in this browser')); return; }
                    const req = indexedDB.open('pfl-local-db', 1);
                    req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                return _idbPromise;
            }
            async function idbGet(key) {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('kv', 'readonly');
                    const req = tx.objectStore('kv').get(key);
                    req.onsuccess = () => resolve(req.result === undefined ? null : { key, value: req.result });
                    req.onerror = () => reject(req.error);
                });
            }
            async function idbSet(key, value) {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('kv', 'readwrite');
                    tx.objectStore('kv').put(value, key);
                    tx.oncomplete = () => resolve({ key, value });
                    tx.onerror = () => reject(tx.error);
                });
            }
            async function idbDelete(key) {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('kv', 'readwrite');
                    tx.objectStore('kv').delete(key);
                    tx.oncomplete = () => resolve({ key, deleted: true });
                    tx.onerror = () => reject(tx.error);
                });
            }
            // Mirrors window.storage's get/set/delete signature. `shared` is only
            // meaningful when window.storage is actually present — the IndexedDB
            // fallback is always local-only, since there's no server to share through.
            async function storageGet(key, shared) {
                if (HAS_CLAUDE_STORAGE) { try { return await window.storage.get(key, shared); } catch (e) { return null; } }
                try { return await idbGet(key); } catch (e) { return null; }
            }
            async function storageSet(key, value, shared) {
                if (HAS_CLAUDE_STORAGE) return await window.storage.set(key, value, shared);
                return await idbSet(key, value);
            }
            async function storageDelete(key, shared) {
                if (HAS_CLAUDE_STORAGE) { try { return await window.storage.delete(key, shared); } catch (e) { return null; } }
                try { return await idbDelete(key); } catch (e) { return null; }
            }

            /* ---------------- persistence ----------------
               Every device reliably saves its own data locally (via storageGet/Set/Delete
               above — window.storage inside Claude.ai, IndexedDB otherwise). Saving to
               these keys with shared=true is an attempt at live cross-device sync, which
               only actually bridges devices when window.storage is present AND the
               platform genuinely shares it between them — that isn't guaranteed, so this
               is best-effort, not a promise. The dependable way to bring devices together
               is the Export + Merge workflow on the Family Sync / Backup pages, which
               works regardless of what storage mode any given device ended up in.
               Storage is split into a few domains rather than one giant blob, so two
               saves happening close together only risk colliding within the SAME domain
               rather than overwriting everything. The device's own profile (name +
               default bank) is kept separately and is never shared — local to that
               phone/browser only. */
            const CORE_KEY = 'pfl:core';
            const TX_KEY = 'pfl:transactions';
            const INV_KEY = 'pfl:investments';
            const LOAN_KEY = 'pfl:loans';
            const PROFILE_KEY = 'pfl:device-profile';
            let DB = null;
            let saving = false;
            let DEVICE_PROFILE = null;

            async function safeGetShared(key) {
                return await storageGet(key, true);
            }

            async function loadDB() {
                try {
                    const [coreR, txR, invR, loanR] = await Promise.all([
                        safeGetShared(CORE_KEY), safeGetShared(TX_KEY), safeGetShared(INV_KEY), safeGetShared(LOAN_KEY)
                    ]);
                    if (coreR && coreR.value) {
                        const core = JSON.parse(coreR.value);
                        DB = {
                            masters: core.masters, settings: core.settings,
                            openingBalances: core.openingBalances || {}, meta: core.meta || { createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
                            transactions: txR && txR.value ? JSON.parse(txR.value) : [],
                            investments: invR && invR.value ? JSON.parse(invR.value) : [],
                            loans: loanR && loanR.value ? JSON.parse(loanR.value) : []
                        };
                    } else {
                        // nobody has ever saved this shared ledger before — start fresh
                        DB = defaultDB();
                    }
                } catch (e) {
                    DB = defaultDB();
                }
                // backfill any masters added in later versions for existing users
                const d = defaultDB();
                if (!DB.masters) DB.masters = d.masters;
                ['banks', 'incomeHeads', 'expenseCategories', 'expenseSubCategories', 'currencies', 'investmentTypes', 'parties', 'riskCategories'].forEach(k => {
                    if (!Array.isArray(DB.masters[k])) DB.masters[k] = d.masters[k];
                });
                // Migration: add newer default main expense categories (with a General
                // sub-category each) to installs that were saved before these existed.
                const newDefaultCats = ['ec-rituals', 'ec-gadgets', 'ec-clothes', 'ec-maintenance', 'ec-misc', 'ec-special'];
                newDefaultCats.forEach(catId => {
                    const defCat = d.masters.expenseCategories.find(c => c.id === catId);
                    if (!defCat) return;
                    const exists = DB.masters.expenseCategories.some(c => c.id === catId || c.name.toLowerCase() === defCat.name.toLowerCase());
                    if (!exists) {
                        DB.masters.expenseCategories.push({ ...defCat });
                        const defSub = d.masters.expenseSubCategories.find(sc => sc.parentCategoryId === catId);
                        if (defSub) DB.masters.expenseSubCategories.push({ ...defSub });
                    } else {
                        // category already exists (maybe under a different id) — just make sure it has a General sub-category
                        const realCat = DB.masters.expenseCategories.find(c => c.id === catId || c.name.toLowerCase() === defCat.name.toLowerCase());
                        const hasGeneral = DB.masters.expenseSubCategories.some(sc => sc.parentCategoryId === realCat.id && sc.name.toLowerCase() === 'general');
                        if (!hasGeneral) DB.masters.expenseSubCategories.push({ id: uid('esc'), parentCategoryId: realCat.id, name: 'General', active: true });
                    }
                });
                // Migration: earlier version used a separate "Head of Account" master for transfers.
                // Remap any legacy hoa-* ids on transfer transactions to the equivalent Income Head.
                if (Array.isArray(DB.transactions)) {
                    const legacyMap = {
                        'hoa-general': 'ih-other', 'hoa-savings': 'ih-passive', 'hoa-business': 'ih-active',
                        'hoa-personal': 'ih-other', 'hoa-investment': 'ih-roi', 'hoa-loan': 'ih-other'
                    };
                    DB.transactions.forEach(t => {
                        if (t.module === 'transfer') {
                            if (t.fromHeadId && legacyMap[t.fromHeadId]) t.fromHeadId = legacyMap[t.fromHeadId];
                            if (t.toHeadId && legacyMap[t.toHeadId]) t.toHeadId = legacyMap[t.toHeadId];
                            if (t.fromHeadId && !findById(DB.masters.incomeHeads, t.fromHeadId)) t.fromHeadId = 'ih-other';
                            if (t.toHeadId && !findById(DB.masters.incomeHeads, t.toHeadId)) t.toHeadId = 'ih-other';
                        }
                    });
                }
                if (DB.masters && Object.prototype.hasOwnProperty.call(DB.masters, 'headOfAccounts')) delete DB.masters.headOfAccounts;
                if (!DB.investments) DB.investments = [];
                if (!DB.loans) DB.loans = [];
                if (!DB.transactions) DB.transactions = [];
                // Migration: give older investments/expenses a default Head of Account & Risk Category if missing
                (DB.investments || []).forEach(inv => {
                    if (!inv.headId || !findById(DB.masters.incomeHeads, inv.headId)) inv.headId = 'ih-other';
                    if (!inv.riskCategoryId || !findById(DB.masters.riskCategories, inv.riskCategoryId)) inv.riskCategoryId = 'risk-med';
                });
                (DB.loans || []).forEach(l => {
                    if (!l.headId || !findById(DB.masters.incomeHeads, l.headId)) l.headId = 'ih-other';
                });
                if (Array.isArray(DB.transactions)) {
                    DB.transactions.forEach(t => {
                        if (t.module === 'expense') {
                            if (!t.headId || !findById(DB.masters.incomeHeads, t.headId)) t.headId = 'ih-other';
                            if (!t.subCategoryId || !findById(DB.masters.expenseSubCategories, t.subCategoryId)) t.subCategoryId = firstSubCatFor(t.refId);
                        }
                        if ((t.module === 'investment_out' || t.module === 'investment_in') && (!t.headId || !findById(DB.masters.incomeHeads, t.headId))) {
                            const inv = findById(DB.investments, t.refId);
                            t.headId = (inv && inv.headId) || 'ih-other';
                        }
                        if ((t.module === 'loan_taken' || t.module === 'loan_given' || t.module === 'loan_repay' || t.module === 'loan_collect') && (!t.headId || !findById(DB.masters.incomeHeads, t.headId))) {
                            const loan = findById(DB.loans, t.refId);
                            t.headId = (loan && loan.headId) || 'ih-other';
                        }
                    });
                }
                if (!DB.settings) DB.settings = d.settings;
                if (!DB.settings.backupFileName) DB.settings.backupFileName = 'Personal_Finance_Ledger';
                if (!DB.openingBalances || typeof DB.openingBalances !== 'object') DB.openingBalances = {};
                // Migration: opening balances used to be a bare number per bank+head; now each
                // carries its own "as on" date, so wrap any legacy numeric entries.
                Object.keys(DB.openingBalances).forEach(k => {
                    const v = DB.openingBalances[k];
                    if (typeof v === 'number') {
                        DB.openingBalances[k] = { amount: v, asOnDate: (DB.meta && DB.meta.createdAt ? DB.meta.createdAt.slice(0, 10) : todayStr()) };
                    } else if (v && typeof v === 'object' && !v.asOnDate) {
                        v.asOnDate = (DB.meta && DB.meta.createdAt ? DB.meta.createdAt.slice(0, 10) : todayStr());
                    }
                });
            }

            let lastSavedAt = null;
            const persist = debounce(async function () { await doSave(); }, 350);

            async function doSave() {
                try {
                    saving = true; renderSaveIndicator();
                    DB.meta.updatedAt = new Date().toISOString();
                    await Promise.all([
                        storageSet(CORE_KEY, JSON.stringify({ masters: DB.masters, settings: DB.settings, openingBalances: DB.openingBalances, meta: DB.meta }), true),
                        storageSet(TX_KEY, JSON.stringify(DB.transactions), true),
                        storageSet(INV_KEY, JSON.stringify(DB.investments), true),
                        storageSet(LOAN_KEY, JSON.stringify(DB.loans), true)
                    ]);
                    lastSavedAt = new Date();
                    if (typeof connectedFileHandle !== 'undefined' && connectedFileHandle) { writeToConnectedFile(); }
                    if (cloudEnabled() && cloudSignedIn()) { cloudQueueAndPush(); }
                } catch (e) {
                    toast('Auto-save failed — check connection', 'error');
                    console.error('save error', e);
                } finally {
                    saving = false; renderSaveIndicator();
                }
            }
            // Bypasses the debounce so data is guaranteed to be written the moment the
            // user navigates away, switches tabs, or closes the app.
            function flushSave() { doSave(); }

            /* ================= CLOUD SYNC (optional; Supabase) =================
               Everything elsewhere in this file works exactly as it did before this
               upgrade: fully local, fully offline, no account needed. This section is
               purely additive. If an admin sets up a free Supabase project (see
               SETUP_GUIDE_CLOUD_SYNC.md) and pastes its Project URL + anon key into
               the Cloud Sync screen once, this SAME app also pushes/pulls through
               that project so every signed-in family member's device sees the same
               ledger. Nothing above this section was rewritten to build this — it
               hooks into the single existing save()/doSave() choke point and the
               existing loadDB() entry point.
            ========================================================================= */
            const CLOUD_CFG_KEY = 'pfl:cloud-config';
            const CLOUD_OUTBOX_KEY = 'pfl:cloud-outbox';
            let CLOUD_CFG = null;        // {url, anonKey}
            let CLOUD_CLIENT = null;     // supabase client instance
            let CLOUD_SESSION = null;    // current auth session
            let CLOUD_MEMBER = null;     // this user's family_members row
            let CLOUD_FAMILY = null;     // this user's families row
            let CLOUD_OUTBOX = [];       // pending local changes not yet pushed: {domain,sqlTable,op,id,row}
            let CLOUD_SNAPSHOT = { transactions: {}, investments: {}, loans: {}, masters: {}, openingBalances: {} };
            let CLOUD_CHANNELS = [];
            let CLOUD_STATUS = 'off';    // off | needs-auth | syncing | online | offline | error
            let CLOUD_ACTIVE = false;    // true only once a connection has actually succeeded this session
            let CLOUD_LAST_ERROR = '';
            let CLOUD_RECENTLY_PUSHED = new Set(); // ids we just pushed, to ignore our own realtime echo briefly

            function cloudEnabled() { return !!CLOUD_CFG; }
            function cloudSignedIn() { return !!(CLOUD_SESSION && CLOUD_MEMBER); }

            /* ---------- config + client ---------- */
            async function loadCloudConfig() {
                try { const r = await storageGet(CLOUD_CFG_KEY, false); if (r && r.value) CLOUD_CFG = JSON.parse(r.value); } catch (e) { CLOUD_CFG = null; }
                try {
                    const o = await storageGet(CLOUD_OUTBOX_KEY, false);
                    if (o && o.value) {
                        const raw = JSON.parse(o.value);
                        // collapse to one (the latest) queued change per row — cleans up any
                        // backlog built up before duplicate-safe queuing was in place
                        const seen = {};
                        raw.forEach(item => { seen[item.domain + ':' + item.op + ':' + item.id] = item; });
                        CLOUD_OUTBOX = Object.values(seen);
                        if (CLOUD_OUTBOX.length !== raw.length) await persistOutbox();
                    }
                } catch (e) { CLOUD_OUTBOX = []; }
            }
            async function saveCloudConfig(cfg) { CLOUD_CFG = cfg; await storageSet(CLOUD_CFG_KEY, JSON.stringify(cfg), false); }
            async function clearCloudConfig() {
                CLOUD_CFG = null; CLOUD_CLIENT = null; CLOUD_SESSION = null; CLOUD_MEMBER = null; CLOUD_FAMILY = null; CLOUD_STATUS = 'off'; CLOUD_ACTIVE = false;
                await storageDelete(CLOUD_CFG_KEY, false);
            }
            async function persistOutbox() { try { await storageSet(CLOUD_OUTBOX_KEY, JSON.stringify(CLOUD_OUTBOX), false); } catch (e) { } }

            const CLOUD_MEM_FALLBACK = {};
            const cloudAuthStorage = {
                getItem: (k) => { try { return window.localStorage.getItem(k); } catch (e) { return CLOUD_MEM_FALLBACK[k] || null; } },
                setItem: (k, v) => { try { window.localStorage.setItem(k, v); } catch (e) { CLOUD_MEM_FALLBACK[k] = v; } },
                removeItem: (k) => { try { window.localStorage.removeItem(k); } catch (e) { delete CLOUD_MEM_FALLBACK[k]; } }
            };
            function initCloudClient() {
                if (!CLOUD_CFG || !window.supabase) return null;
                if (CLOUD_CLIENT) return CLOUD_CLIENT;
                CLOUD_CLIENT = window.supabase.createClient(CLOUD_CFG.url, CLOUD_CFG.anonKey, {
                    auth: { storage: cloudAuthStorage, persistSession: true, autoRefreshToken: true }
                });
                return CLOUD_CLIENT;
            }

            /* ---------- field mapping: app's camelCase objects <-> Postgres snake_case rows ---------- */
            const TABLE_FIELD_MAPS = {
                banks: [['id', 'id'], ['name', 'name'], ['holder', 'holder'], ['accNo', 'acc_no'], ['ifsc', 'ifsc'], ['openingBalance', 'opening_balance'], ['openingDate', 'opening_date'], ['active', 'active']],
                incomeHeads: [['id', 'id'], ['name', 'name'], ['active', 'active']],
                expenseCategories: [['id', 'id'], ['name', 'name'], ['active', 'active']],
                expenseSubCategories: [['id', 'id'], ['parentCategoryId', 'parent_category_id'], ['name', 'name'], ['active', 'active']],
                currencies: [['id', 'id'], ['code', 'code'], ['symbol', 'symbol'], ['name', 'name'], ['rate', 'rate'], ['isBase', 'is_base'], ['active', 'active']],
                investmentTypes: [['id', 'id'], ['name', 'name'], ['active', 'active']],
                riskCategories: [['id', 'id'], ['name', 'name'], ['active', 'active']],
                parties: [['id', 'id'], ['name', 'name'], ['type', 'type'], ['active', 'active']]
            };
            const MASTER_SQL_TABLE = {
                banks: 'banks', incomeHeads: 'income_heads', expenseCategories: 'expense_categories', expenseSubCategories: 'expense_subcategories',
                currencies: 'currencies', investmentTypes: 'investment_types', riskCategories: 'risk_categories', parties: 'parties'
            };
            const TX_FIELD_MAP = [['id', 'id'], ['module', 'module'], ['date', 'date'], ['description', 'description'], ['remarks', 'remarks'],
            ['bankId', 'bank_id'], ['refId', 'ref_id'], ['headId', 'head_id'], ['subCategoryId', 'sub_category_id'],
            ['fromHeadId', 'from_head_id'], ['toHeadId', 'to_head_id'], ['fromPartyId', 'from_party_id'], ['toPartyId', 'to_party_id'],
            ['linkId', 'link_id'], ['direction', 'direction'], ['amount', 'amount'], ['currencyId', 'currency_id'], ['amountBase', 'amount_base']];
            const INV_FIELD_MAP = [['id', 'id'], ['bankId', 'bank_id'], ['headId', 'head_id'], ['investmentTypeId', 'investment_type_id'], ['riskCategoryId', 'risk_category_id'],
            ['principal', 'principal'], ['currentValue', 'current_value'], ['investDate', 'invest_date'], ['maturityDate', 'maturity_date'],
            ['expectedRate', 'expected_rate'], ['status', 'status'], ['remarks', 'remarks'], ['redemptions', 'redemptions']];
            const LOAN_FIELD_MAP = [['id', 'id'], ['partyId', 'party_id'], ['kind', 'kind'], ['headId', 'head_id'], ['principal', 'principal'], ['outstanding', 'outstanding'],
            ['interestRate', 'interest_rate'], ['startDate', 'start_date'], ['remarks', 'remarks'], ['status', 'status']];

            function toSqlRow(map, obj, extra) {
                const row = Object.assign({}, extra);
                map.forEach(([jsKey, sqlKey]) => { if (obj[jsKey] !== undefined) row[sqlKey] = (obj[jsKey] === '' ? null : obj[jsKey]); });
                return row;
            }
            function fromSqlRow(map, row, extra) {
                const obj = Object.assign({}, extra);
                map.forEach(([jsKey, sqlKey]) => { obj[jsKey] = row[sqlKey]; });
                return obj;
            }

            /* ---------- auth + family bootstrap ---------- */
            async function cloudSignUp(email, password) {
                const client = initCloudClient();
                const { data, error } = await client.auth.signUp({ email, password });
                if (error) throw error;
                return data;
            }
            async function cloudSignIn(email, password) {
                const client = initCloudClient();
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) throw error;
                CLOUD_SESSION = data.session;
                return data;
            }
            async function cloudSignOut() {
                const client = initCloudClient();
                if (client) { CLOUD_CHANNELS.forEach(ch => client.removeChannel(ch)); await client.auth.signOut(); }
                CLOUD_CHANNELS = []; CLOUD_SESSION = null; CLOUD_MEMBER = null; CLOUD_FAMILY = null; CLOUD_STATUS = 'needs-auth'; CLOUD_ACTIVE = false;
            }
            async function cloudCreateFamily(familyName, displayName) {
                const client = initCloudClient();
                const { data, error } = await client.rpc('create_family_and_admin', { p_family_name: familyName, p_display_name: displayName, p_base_currency: baseCurrency().code });
                if (error) throw error;
                return data;
            }
            async function cloudJoinFamily(joinCode, displayName) {
                const client = initCloudClient();
                const { data, error } = await client.rpc('join_family', { p_join_code: joinCode.trim(), p_display_name: displayName });
                if (error) throw error;
                return data;
            }
            async function cloudLoadMember() {
                const client = initCloudClient();
                const { data: { user } } = await client.auth.getUser();
                if (!user) return null;
                const { data, error } = await client.from('family_members').select('*').eq('id', user.id).maybeSingle();
                if (error) throw error;
                CLOUD_MEMBER = data;
                if (data) {
                    const fam = await client.from('families').select('*').eq('id', data.family_id).maybeSingle();
                    CLOUD_FAMILY = fam.data || null;
                }
                return data;
            }
            function cloudIsAdmin() { return !!(CLOUD_MEMBER && CLOUD_MEMBER.role === 'admin' && CLOUD_MEMBER.active); }

            /* ---------- seed a brand-new family with the app's sensible defaults ---------- */
            function genUuid() {
                if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }
            async function cloudSeedDefaults() {
                const client = initCloudClient();
                const fam = CLOUD_MEMBER.family_id;
                const d = defaultDB();
                const idMaps = {}; // per master key: old app-internal id -> new real uuid
                for (const key of Object.keys(MASTER_SQL_TABLE)) {
                    idMaps[key] = {};
                    const rows = d.masters[key].map(m => {
                        const newId = genUuid();
                        idMaps[key][m.id] = newId;
                        const remapped = Object.assign({}, m, { id: newId });
                        if (key === 'expenseSubCategories' && m.parentCategoryId) {
                            remapped.parentCategoryId = idMaps.expenseCategories[m.parentCategoryId] || null;
                        }
                        return toSqlRow(TABLE_FIELD_MAPS[key], remapped, { family_id: fam });
                    });
                    if (rows.length) {
                        const r = await client.from(MASTER_SQL_TABLE[key]).insert(rows);
                        if (r.error) { console.error('seed failed for', key, r.error); throw new Error('Could not set up default ' + key + ': ' + r.error.message); }
                    }
                }
            }

            /* ---------- full pull (replaces local DB.* with cloud's copy) ---------- */
            async function cloudPullAll(retriedSeed) {
                const client = initCloudClient();
                const fam = CLOUD_MEMBER.family_id;
                const [banksR, ihR, ecR, escR, curR, itR, rcR, partiesR, obR, txR, invR, loanR] = await Promise.all([
                    client.from('banks').select('*').eq('family_id', fam).order('name'),
                    client.from('income_heads').select('*').eq('family_id', fam).order('name'),
                    client.from('expense_categories').select('*').eq('family_id', fam).order('name'),
                    client.from('expense_subcategories').select('*').eq('family_id', fam),
                    client.from('currencies').select('*').eq('family_id', fam),
                    client.from('investment_types').select('*').eq('family_id', fam),
                    client.from('risk_categories').select('*').eq('family_id', fam),
                    client.from('parties').select('*').eq('family_id', fam),
                    client.from('opening_balances').select('*').eq('family_id', fam),
                    client.from('transactions').select('*').eq('family_id', fam).eq('deleted', false),
                    client.from('investments').select('*').eq('family_id', fam).eq('deleted', false),
                    client.from('loans').select('*').eq('family_id', fam).eq('deleted', false)
                ]);
                if ((banksR.data || []).length === 0) {
                    if (retriedSeed) throw new Error('Family setup did not complete — default banks/categories could not be created. Check the browser console and your Supabase project for details.');
                    await cloudSeedDefaults();
                    return cloudPullAll(true);
                }
                DB.masters.banks = (banksR.data || []).map(r => fromSqlRow(TABLE_FIELD_MAPS.banks, r));
                DB.masters.incomeHeads = (ihR.data || []).map(r => fromSqlRow(TABLE_FIELD_MAPS.incomeHeads, r));
                DB.masters.expenseCategories = (ecR.data || []).map(r => fromSqlRow(TABLE_FIELD_MAPS.expenseCategories, r));
                DB.masters.expenseSubCategories = (escR.data || []).map(r => fromSqlRow(TABLE_FIELD_MAPS.expenseSubCategories, r));
                DB.masters.currencies = (curR.data || []).map(r => fromSqlRow(TABLE_FIELD_MAPS.currencies, r));
                DB.masters.investmentTypes = (itR.data || []).map(r => fromSqlRow(TABLE_FIELD_MAPS.investmentTypes, r));
                DB.masters.riskCategories = (rcR.data || []).map(r => fromSqlRow(TABLE_FIELD_MAPS.riskCategories, r));
                DB.masters.parties = (partiesR.data || []).map(r => fromSqlRow(TABLE_FIELD_MAPS.parties, r));
                DB.openingBalances = {};
                (obR.data || []).forEach(r => { DB.openingBalances[r.bank_id + '|' + r.head_id] = { amount: Number(r.amount || 0), asOnDate: r.as_on_date }; });
                DB.transactions = (txR.data || []).map(r => {
                    const t = fromSqlRow(TX_FIELD_MAP, r);
                    t.createdBy = r.created_by_name || 'Family Member'; t.createdAt = r.created_at; t.updatedAt = r.updated_at; t._cloudUpdatedAt = r.updated_at;
                    return t;
                });
                DB.investments = (invR.data || []).map(r => { const i = fromSqlRow(INV_FIELD_MAP, r); i._cloudUpdatedAt = r.updated_at; return i; });
                DB.loans = (loanR.data || []).map(r => { const l = fromSqlRow(LOAN_FIELD_MAP, r); l._cloudUpdatedAt = r.updated_at; return l; });
                rebuildCloudSnapshot();
            }
            function rebuildCloudSnapshot() {
                CLOUD_SNAPSHOT.transactions = {}; DB.transactions.forEach(t => { CLOUD_SNAPSHOT.transactions[t.id] = JSON.stringify(t); });
                CLOUD_SNAPSHOT.investments = {}; DB.investments.forEach(i => { CLOUD_SNAPSHOT.investments[i.id] = JSON.stringify(i); });
                CLOUD_SNAPSHOT.loans = {}; DB.loans.forEach(l => { CLOUD_SNAPSHOT.loans[l.id] = JSON.stringify(l); });
                CLOUD_SNAPSHOT.masters = {};
                Object.keys(MASTER_SQL_TABLE).forEach(key => {
                    CLOUD_SNAPSHOT.masters[key] = {};
                    (DB.masters[key] || []).forEach(m => { CLOUD_SNAPSHOT.masters[key][m.id] = JSON.stringify(m); });
                });
                CLOUD_SNAPSHOT.openingBalances = {};
                Object.keys(DB.openingBalances || {}).forEach(k => { CLOUD_SNAPSHOT.openingBalances[k] = JSON.stringify(DB.openingBalances[k]); });
            }
            // Adds/replaces a pending outbox item, collapsing any earlier queued change to
            // the exact same row so rapid edits don't pile up duplicate work.
            function enqueueOutboxItem(item) {
                const key = item.domain + ':' + item.op + ':' + item.id;
                CLOUD_OUTBOX = CLOUD_OUTBOX.filter(x => (x.domain + ':' + x.op + ':' + x.id) !== key);
                CLOUD_OUTBOX.push(item);
            }

            /* ---------- diff current DB vs last-known-synced snapshot, queue + push ---------- */
            function cloudDiffDomain(rows, snapshotObj) {
                const upserts = [], deletes = []; const seen = new Set();
                rows.forEach(r => {
                    seen.add(r.id);
                    const clean = Object.assign({}, r); delete clean._cloudUpdatedAt;
                    const now = JSON.stringify(clean);
                    if (snapshotObj[r.id] !== now) upserts.push(r);
                });
                Object.keys(snapshotObj).forEach(id => { if (!seen.has(id)) deletes.push(id); });
                return { upserts, deletes };
            }
            async function cloudQueueAndPush() {
                if (!cloudEnabled() || !cloudSignedIn()) return;
                const txDiff = cloudDiffDomain(DB.transactions, CLOUD_SNAPSHOT.transactions);
                const invDiff = cloudDiffDomain(DB.investments, CLOUD_SNAPSHOT.investments);
                const loanDiff = cloudDiffDomain(DB.loans, CLOUD_SNAPSHOT.loans);
                txDiff.upserts.forEach(t => enqueueOutboxItem({ domain: 'transactions', sqlTable: 'transactions', op: 'upsert', id: t.id, row: t }));
                txDiff.deletes.forEach(id => enqueueOutboxItem({ domain: 'transactions', sqlTable: 'transactions', op: 'delete', id }));
                invDiff.upserts.forEach(i => enqueueOutboxItem({ domain: 'investments', sqlTable: 'investments', op: 'upsert', id: i.id, row: i }));
                invDiff.deletes.forEach(id => enqueueOutboxItem({ domain: 'investments', sqlTable: 'investments', op: 'delete', id }));
                loanDiff.upserts.forEach(l => enqueueOutboxItem({ domain: 'loans', sqlTable: 'loans', op: 'upsert', id: l.id, row: l }));
                loanDiff.deletes.forEach(id => enqueueOutboxItem({ domain: 'loans', sqlTable: 'loans', op: 'delete', id }));
                // masters + opening balances: admin-only writes, now properly diffed against
                // their own snapshots so unchanged rows are never re-queued.
                if (cloudIsAdmin()) {
                    Object.keys(MASTER_SQL_TABLE).forEach(key => {
                        const diff = cloudDiffDomain(DB.masters[key] || [], (CLOUD_SNAPSHOT.masters && CLOUD_SNAPSHOT.masters[key]) || {});
                        diff.upserts.forEach(m => enqueueOutboxItem({ domain: 'masters:' + key, sqlTable: MASTER_SQL_TABLE[key], op: 'upsert', id: m.id, row: m, mapKey: key }));
                        diff.deletes.forEach(id => enqueueOutboxItem({ domain: 'masters:' + key, sqlTable: MASTER_SQL_TABLE[key], op: 'delete', id }));
                    });
                    const obRows = Object.keys(DB.openingBalances || {}).map(k => Object.assign({ id: k }, DB.openingBalances[k]));
                    const obDiff = cloudDiffDomain(obRows, CLOUD_SNAPSHOT.openingBalances || {});
                    obDiff.upserts.forEach(o => {
                        const [bankId, headId] = o.id.split('|');
                        enqueueOutboxItem({
                            domain: 'openingBalances', sqlTable: 'opening_balances', op: 'upsert', id: o.id,
                            row: { bank_id: bankId, head_id: headId, amount: o.amount, as_on_date: o.asOnDate || null }
                        });
                    });
                    obDiff.deletes.forEach(id => enqueueOutboxItem({ domain: 'openingBalances', sqlTable: 'opening_balances', op: 'delete', id }));
                }
                rebuildCloudSnapshot();
                await persistOutbox();
                flushOutbox();
            }
            let CLOUD_FLUSHING = false;
            async function flushOutbox() {
                if (CLOUD_FLUSHING || !cloudEnabled() || !cloudSignedIn()) return;
                if (!navigator.onLine) { CLOUD_STATUS = 'offline'; renderSaveIndicator(); return; }
                if (!CLOUD_OUTBOX.length) { CLOUD_STATUS = 'online'; renderSaveIndicator(); return; }
                CLOUD_FLUSHING = true; CLOUD_STATUS = 'syncing'; renderSaveIndicator();
                const client = initCloudClient();
                const batch = CLOUD_OUTBOX.slice(0, 50); // keep each round small
                const succeeded = [];
                try {
                    for (const item of batch) {
                        let res;
                        if (item.op === 'delete') {
                            if (item.sqlTable === 'opening_balances') {
                                const [bankId, headId] = String(item.id).split('|');
                                res = await client.from('opening_balances').delete().eq('family_id', CLOUD_MEMBER.family_id).eq('bank_id', bankId).eq('head_id', headId);
                            } else {
                                res = await client.from(item.sqlTable).update({ deleted: true, updated_at: new Date().toISOString() }).eq('id', item.id);
                            }
                        } else {
                            let row;
                            if (item.domain === 'transactions') row = toSqlRow(TX_FIELD_MAP, item.row, { family_id: CLOUD_MEMBER.family_id, created_by: CLOUD_MEMBER.id, created_by_name: item.row.createdBy || currentUserName(), updated_at: new Date().toISOString() });
                            else if (item.domain === 'investments') row = toSqlRow(INV_FIELD_MAP, item.row, { family_id: CLOUD_MEMBER.family_id, updated_at: new Date().toISOString() });
                            else if (item.domain === 'loans') row = toSqlRow(LOAN_FIELD_MAP, item.row, { family_id: CLOUD_MEMBER.family_id, updated_at: new Date().toISOString() });
                            else if (item.domain === 'openingBalances') row = Object.assign({ family_id: CLOUD_MEMBER.family_id, updated_at: new Date().toISOString() }, item.row);
                            else row = toSqlRow(TABLE_FIELD_MAPS[item.mapKey], item.row, { family_id: CLOUD_MEMBER.family_id, updated_at: new Date().toISOString() });
                            const onConflict = item.sqlTable === 'opening_balances' ? 'family_id,bank_id,head_id' : 'id';
                            res = await client.from(item.sqlTable).upsert(row, { onConflict });
                        }
                        if (res.error) { console.error('cloud push failed', item, res.error); CLOUD_LAST_ERROR = res.error.message; continue; }
                        succeeded.push(item);
                        CLOUD_RECENTLY_PUSHED.add(String(item.id));
                        setTimeout(() => CLOUD_RECENTLY_PUSHED.delete(String(item.id)), 4000);
                    }
                    if (succeeded.length) {
                        await client.from('audit_log').insert({
                            family_id: CLOUD_MEMBER.family_id, actor_id: CLOUD_MEMBER.id, actor_name: CLOUD_MEMBER.display_name,
                            action: 'sync', entity: 'batch', detail: { count: succeeded.length }
                        });
                    }
                } catch (e) { CLOUD_LAST_ERROR = String(e.message || e); console.error(e); }
                const succeededKeys = new Set(succeeded.map(s => s.domain + ':' + s.op + ':' + s.id));
                CLOUD_OUTBOX = CLOUD_OUTBOX.filter(item => !succeededKeys.has(item.domain + ':' + item.op + ':' + item.id));
                await persistOutbox();
                CLOUD_FLUSHING = false;
                CLOUD_STATUS = CLOUD_OUTBOX.length ? 'syncing' : 'online';
                renderSaveIndicator();
                if (CLOUD_OUTBOX.length) setTimeout(flushOutbox, 4000);
            }

            /* ---------- realtime: apply remote changes as they arrive ---------- */
            function cloudApplyRemoteRow(domainArr, map, sqlRow, extraFields) {
                if (CLOUD_RECENTLY_PUSHED.has(String(sqlRow.id))) return; // ignore echo of our own push
                const obj = fromSqlRow(map, sqlRow); if (extraFields) extraFields(obj, sqlRow);
                const idx = domainArr.findIndex(r => r.id === obj.id);
                if (sqlRow.deleted) { if (idx >= 0) domainArr.splice(idx, 1); return; }
                if (idx >= 0) {
                    // last-write-wins by timestamp so a slower device never silently clobbers a newer edit
                    const localTs = domainArr[idx]._cloudUpdatedAt || domainArr[idx].updatedAt || '';
                    if (sqlRow.updated_at && sqlRow.updated_at < localTs) return;
                    domainArr[idx] = obj;
                } else {
                    domainArr.push(obj);
                }
            }
            function cloudSubscribeRealtime() {
                const client = initCloudClient();
                if (!client || !CLOUD_MEMBER) return;
                const fam = CLOUD_MEMBER.family_id;
                const chan = client.channel('family-' + fam);
                chan.on('postgres_changes', { event: '*', schema: 'public', table: 'transactions', filter: 'family_id=eq.' + fam }, (payload) => {
                    if (payload.eventType === 'DELETE') { DB.transactions = DB.transactions.filter(t => t.id !== payload.old.id); }
                    else cloudApplyRemoteRow(DB.transactions, TX_FIELD_MAP, payload.new, (o, r) => { o.createdBy = r.created_by_name || 'Family Member'; o.createdAt = r.created_at; o.updatedAt = r.updated_at; o._cloudUpdatedAt = r.updated_at; });
                    rebuildCloudSnapshot(); if (CURRENT_ROUTE) renderContent();
                });
                chan.on('postgres_changes', { event: '*', schema: 'public', table: 'investments', filter: 'family_id=eq.' + fam }, (payload) => {
                    if (payload.eventType === 'DELETE') { DB.investments = DB.investments.filter(i => i.id !== payload.old.id); }
                    else cloudApplyRemoteRow(DB.investments, INV_FIELD_MAP, payload.new, (o, r) => { o._cloudUpdatedAt = r.updated_at; });
                    rebuildCloudSnapshot(); if (CURRENT_ROUTE) renderContent();
                });
                chan.on('postgres_changes', { event: '*', schema: 'public', table: 'loans', filter: 'family_id=eq.' + fam }, (payload) => {
                    if (payload.eventType === 'DELETE') { DB.loans = DB.loans.filter(l => l.id !== payload.old.id); }
                    else cloudApplyRemoteRow(DB.loans, LOAN_FIELD_MAP, payload.new, (o, r) => { o._cloudUpdatedAt = r.updated_at; });
                    rebuildCloudSnapshot(); if (CURRENT_ROUTE) renderContent();
                });
                Object.keys(MASTER_SQL_TABLE).forEach(key => {
                    chan.on('postgres_changes', { event: '*', schema: 'public', table: MASTER_SQL_TABLE[key], filter: 'family_id=eq.' + fam }, (payload) => {
                        if (payload.eventType === 'DELETE') { DB.masters[key] = DB.masters[key].filter(m => m.id !== payload.old.id); }
                        else cloudApplyRemoteRow(DB.masters[key], TABLE_FIELD_MAPS[key], payload.new);
                        if (CURRENT_ROUTE) renderContent();
                    });
                });
                chan.on('postgres_changes', { event: '*', schema: 'public', table: 'opening_balances', filter: 'family_id=eq.' + fam }, (payload) => {
                    const r = payload.new || payload.old;
                    const key = r.bank_id + '|' + r.head_id;
                    if (payload.eventType === 'DELETE') { delete DB.openingBalances[key]; }
                    else DB.openingBalances[key] = { amount: Number(r.amount || 0), asOnDate: r.as_on_date };
                    if (CURRENT_ROUTE) renderContent();
                });
                chan.subscribe();
                CLOUD_CHANNELS.push(chan);
            }

            /* ---------------- cloud auth + family setup screens ---------------- */
            function renderCloudAuth(mode) {
                document.getElementById('app').innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper);">
    <div class="card card-pad" style="max-width:420px;width:100%;border-top:4px solid var(--brass);">
      <div style="text-align:center;margin-bottom:18px;">
        <div style="display:inline-flex;width:44px;height:44px;font-size:20px;border-radius:10px;border:1.5px solid var(--brass);color:var(--brass);align-items:center;justify-content:center;margin-bottom:10px;font-family:var(--font-display);font-weight:700;">₹</div>
        <h2 style="font-family:var(--font-display);">${mode === 'signin' ? 'Sign In' : 'Create Your Account'}</h2>
        <p class="hint">Cloud Sync is on for this ledger — sign in to reach your family's shared data.</p>
      </div>
      <div class="field" style="margin-bottom:12px;"><label>Email</label><input type="email" id="auth-email" placeholder="you@example.com"/></div>
      <div class="field" style="margin-bottom:16px;"><label>Password</label><input type="password" id="auth-password" placeholder="At least 6 characters"/></div>
      <div id="auth-error" class="hint" style="color:var(--rust);min-height:16px;margin-bottom:8px;"></div>
      <div class="form-actions" style="flex-direction:column;gap:8px;">
        <button class="btn btn-brass" style="width:100%;justify-content:center;" onclick="PFL.submitCloudAuth('${mode}')">${mode === 'signin' ? 'Sign In' : 'Sign Up'}</button>
        <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="PFL.renderCloudAuth('${mode === 'signin' ? 'signup' : 'signin'}')">${mode === 'signin' ? "Don't have an account? Sign Up" : 'Already have an account? Sign In'}</button>
        <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="PFL.disableCloudAndUseLocal()">Use this device locally instead (no cloud)</button>
      </div>
    </div>
  </div>`;
            }
            async function submitCloudAuth(mode) {
                const email = document.getElementById('auth-email').value.trim();

            async function submitCloudSetup() {

                    return;

                if (!/^https?:\/\/[^\s'"]+$/i.test(url)) {
                    errEl.textContent = 'That doesn\'t look like a valid URL — it must start with https:// and contain no spaces or quote characters. Example: https://abcdefgh.supabase.co';

                    errEl.textContent = 'That\'s the Secret key — never use it here, it grants full unrestricted access and bypasses your security rules. Use the Publishable key (starts sb_publishable_) or the anon/public key (starts eyJ) instead.';
                    return;

                if (!/^(sb_publishable_|eyJ)/.test(key)) {

            function renderSaveIndicator() {

                if (!el) return;

                const t = lastSavedAt ? lastSavedAt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
