    <button class="btn btn-danger" onclick="PFL.resetAll()">Erase All Data</button>
  </div>`;
            }
            function setBackupFileName(v) {
                DB.settings.backupFileName = (v || '').trim().replace(/[\\/:*?"<>|]+/g, '-') || 'Personal_Finance_Ledger';
                save();
            }
            function doBackup() {
                const fname = DB.settings.backupFileName || 'Personal_Finance_Ledger';
                downloadBlob(JSON.stringify(DB, null, 2), fname + '_' + todayStr() + '.json', 'application/json');
                toast('Backup downloaded');
            }
            function doRestore(ev) {
                const file = ev.target.files[0];
                if (!file) return;
                const cloudWarn = cloudEnabled() ? ' Cloud Sync is ON, so this will also push these changes out to every other signed-in family member.' : '';
                if (!confirmAction('This will replace all current data with the backup file.' + cloudWarn + ' Continue?')) { ev.target.value = ''; return; }
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!parsed.masters || !parsed.transactions) { throw new Error('invalid file'); }
                        DB = parsed;
                        save(); toast('Backup restored'); go('dashboard');
                    } catch (err) {
                        toast('Could not read this backup file', 'error');
                    }
                };
                reader.readAsText(file);
            }
            function resetAll() {
                const cloudWarn = cloudEnabled() ? ' Cloud Sync is ON — this will erase the shared ledger for every family member, not just this device.' : '';

                connectedFileHandle = null; connectedFileName = null;
                save(); toast('All data erased'); go('dashboard');
            }

            /* ---------------- connected local file (File System Access API) ----------------
               Lets a user pick ONE real file on their device and keep reading/writing that
               exact file across the whole session — the closest a browser app can get to
               "always use this file name" without a server. Chromium browsers only;
               everywhere else falls back to the manual Backup/Restore above. */
            let connectedFileHandle = null;
            let connectedFileName = null;
            let connectedAutoSyncOK = null;
            async function connectNewFile() {
                if (!('showSaveFilePicker' in window)) { toast("This browser doesn't support connecting a file — use manual Backup/Restore", "error"); return; }
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: (DB.settings.backupFileName || 'Personal_Finance_Ledger') + '.json',
                        types: [{ description: 'Personal Finance Ledger file', accept: { 'application/json': ['.json'] } }]
                    });
                    connectedFileHandle = handle; connectedFileName = handle.name; connectedAutoSyncOK = null;
                    await writeToConnectedFile();
                    toast('Connected — this file will now stay in sync');
                    renderContent();
                } catch (e) { if (e.name !== 'AbortError') { toast('Could not connect that file', 'error'); console.error(e); } }
            }
            async function openExistingFile() {
                if (!('showOpenFilePicker' in window)) { toast("This browser doesn't support opening a file this way — use manual Restore", "error"); return; }
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{ description: 'Personal Finance Ledger file', accept: { 'application/json': ['.json'] } }]
                    });
                    const file = await handle.getFile();
                    const text = await file.text();
                    const parsed = JSON.parse(text);
                    if (!parsed.masters || !parsed.transactions) throw new Error('invalid');
                    if (!confirmAction('Load data from "' + handle.name + '"? This will replace everything currently in the app.')) { return; }
                    DB = parsed;
                    connectedFileHandle = handle; connectedFileName = handle.name; connectedAutoSyncOK = null;
                    save(); toast('Loaded from ' + connectedFileName); go('dashboard');
                } catch (e) { if (e.name !== 'AbortError') { toast('Could not open that file — is it a valid backup?', 'error'); console.error(e); } }
            }
            async function writeToConnectedFile() {
                if (!connectedFileHandle) return;
                try {
                    const writable = await connectedFileHandle.createWritable();
                    await writable.write(JSON.stringify(DB, null, 2));
                    await writable.close();
                    connectedAutoSyncOK = true;
                } catch (e) {
                    connectedAutoSyncOK = false;
                    console.error('connected file write failed', e);
                }
            }
            async function saveToConnectedFileNow() {
                if (!connectedFileHandle) { toast('No file connected yet', 'error'); return; }
                await writeToConnectedFile();
                toast(connectedAutoSyncOK ? ('Saved to ' + connectedFileName) : 'Could not write to the connected file', 'error');
                renderContent();
            }
            async function loadFromConnectedFile() {
                if (!connectedFileHandle) { toast('No file connected yet', 'error'); return; }
                try {
                    const file = await connectedFileHandle.getFile();
                    const text = await file.text();
                    const parsed = JSON.parse(text);
                    if (!parsed.masters || !parsed.transactions) throw new Error('invalid');
                    if (!confirmAction('Reload data from "' + connectedFileName + '"? This will replace everything currently in the app.')) return;
                    DB = parsed;
                    save(); toast('Reloaded from ' + connectedFileName); go('dashboard');
                } catch (e) { toast('Could not read the connected file', 'error'); console.error(e); }
            }
            function disconnectFile() { connectedFileHandle = null; connectedFileName = null; connectedAutoSyncOK = null; renderContent(); toast('File disconnected'); }

            /* ---------------- Save & Exit (single button) ----------------
               One click: flush everything to the app's own storage, then let the user
               pick their own file name AND folder (via the browser's native picker where
               supported) to save a full copy, then confirm it's safe to close the tab. */
            async function saveAndExit() {
                await doSave(); // make sure the in-app store is fully up to date first
                if ('showSaveFilePicker' in window) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: (DB.settings.backupFileName || 'Personal_Finance_Ledger') + '.json',
                            types: [{ description: 'Personal Finance Ledger file', accept: { 'application/json': ['.json'] } }]
                        });
                        const writable = await handle.createWritable();
                        await writable.write(JSON.stringify(DB, null, 2));
                        await writable.close();
                        connectedFileHandle = handle; connectedFileName = handle.name; connectedAutoSyncOK = true;
                        DB.settings.backupFileName = handle.name.replace(/\.json$/i, '');
                        save();
                        showExitConfirmModal(handle.name, true);
                    } catch (e) {
                        if (e.name !== 'AbortError') { toast('Could not save the file', 'error'); console.error(e); }
                        // user cancelled the picker — do nothing, they stay in the app
                    }
                } else {
                    openSaveAsModal();
                }
            }
            function openSaveAsModal() {
                const fname = DB.settings.backupFileName || 'Personal_Finance_Ledger';
                openModal(`
    <div class="modal-head"><h3>Save As</h3><button class="btn btn-icon btn-ghost" onclick="PFL.closeModal()">✕</button></div>
    <div class="field"><label>File name</label><input type="text" id="saveas-name" value="${esc(fname)}"/><div class="err"></div></div>
    <p class="hint">This browser doesn't support choosing a folder directly from a web page, so the file will go to your browser's default Downloads location (or it will prompt you to choose, if your browser is set to "ask where to save each file" in its settings).</p>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="PFL.confirmSaveAs()">Save</button>
      <button class="btn btn-ghost" onclick="PFL.closeModal()">Cancel</button>
    </div>
  `);
            }
            function confirmSaveAs() {
                const input = document.getElementById('saveas-name');
                const val = (input.value || '').trim().replace(/[\\/:*?"<>|]+/g, '-');
                if (!val) { input.classList.add('invalid'); return; }
                DB.settings.backupFileName = val; save();
                downloadBlob(JSON.stringify(DB, null, 2), val + '.json', 'application/json');
                closeModal();
                showExitConfirmModal(val + '.json', false);
            }
            function showExitConfirmModal(filename, synced) {
                openModal(`
    <div class="modal-head"><h3>Saved ✓</h3></div>
    <p>Your entire ledger has been saved to <b>${esc(filename)}</b>${synced ? ' — this file will keep syncing automatically while you continue working, and you can reuse it any time from Backup &amp; Restore → Open an Existing File.' : '.'}</p>
    <p class="hint">It's safe to close this tab now. Everything is also kept in the app's own storage, so you can simply reopen it later instead if you'd rather.</p>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="PFL.tryCloseTab()">Close Tab</button>
      <button class="btn btn-ghost" onclick="PFL.closeModal()">Keep Working</button>
    </div>
  `);
            }
            function tryCloseTab() {
                closeModal();
                window.close();
                setTimeout(() => { toast('Your data is saved — you can close this tab whenever you like', 'info'); }, 250);
            }

            /* ================= GLOBAL API + BOOTSTRAP ================= */
            window.PFL = {
                go, toggleSidebar, closeSidebar, toggleTheme, closeModal,
                confirmNavSave, confirmNavDiscard, cancelNav,
                completeOnboarding, skipOnboarding, showOnboardingAgain, cancelSwitchPerson, switchPersonNow,
                setQuickType, setQuickField, setQuickMainCat, saveQuickEntry,
                renderCloudAuth, submitCloudAuth, setFamSetupTab, submitCreateFamily, submitJoinFamily,
                signOutToAuth, disableCloudAndUseLocal, submitCloudSetup, refreshCloudMembers, toggleCloudMemberActive, retryCloudConnect, openCloudEdit, cancelCloudEdit,
                setMasterTab, openMasterForm, saveMaster, toggleMasterActive, deleteMaster,
                saveEntry, editEntry, updateEntry, deleteEntryFromForm, clearEntryForm, onMainCategoryChange,
                setIncomeSubTab, setSubledgerOpeningBalance, setSubledgerOpeningDate,
                saveTransfer,
                setInvestTab, saveInvestment, onRedeemSelect, saveRedemption,
                setLoanTab, saveLoan, onLoanSelect, saveLoanPayment,
                setRegFilter, setRegMainCat, resetRegFilters, setRegPage, deleteTransaction, exportRegisterExcel, exportRegisterPDF, toggleRegFreeze,
                setReportType, setReportField, exportReportExcel, exportReportPDF, toggleReportFreeze,
                handleImportFile, setImportMapping, setImportAmountMode, toggleImportOption, commitImport, resetImport,
                doBackup, doRestore, resetAll, setBackupFileName, mergeImportFile,
                connectNewFile, openExistingFile, saveToConnectedFileNow, loadFromConnectedFile, disconnectFile,
                saveAndExit, openSaveAsModal, confirmSaveAs, showExitConfirmModal, tryCloseTab
            };

            document.addEventListener('keydown', function (e) {
                if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    if (CURRENT_ROUTE === 'register') {
                        e.preventDefault();
                        const el = document.querySelector('.table-toolbar input[type=text]');
                        if (el) el.focus();
                    }
                }
            });

            // Guarantee the ledger is written to storage the moment the user leaves —
            // closing the tab/app, switching apps, or navigating away — so whatever was
            // last entered is always there the next time they open Personal Finance
            // Ledger Pro, with no explicit "save" step required from the user.
            // If a form on screen has unsaved input, or a save is still in flight, ask the
            // browser to confirm before actually closing. Browsers do not allow a custom
            // "Save / Don't Save" dialog here (Chrome, Firefox, Safari and Edge have all
            // ignored custom confirm-close text and buttons since ~2011, for security) —
            // only their own fixed "Leave site?" prompt can be triggered, which is the
            // closest equivalent the web platform allows.
            window.addEventListener('beforeunload', function (e) {
                flushSave();
                if (FORM_DIRTY || saving) {
                    e.preventDefault();
                    e.returnValue = '';
                    return '';
                }
            });
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') flushSave();
            });

            let ONBOARDING_SKIPPED = false;
            async function init() {
                document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;width:100%;font-family:${'Inter, sans-serif'};color:#5B6660;">Loading your ledger…</div>`;
                await loadDB();
                await loadDeviceProfile();
                await loadCloudConfig();
                if (cloudEnabled()) {
                    try {
                        const client = initCloudClient();
                        if (!client) throw new Error('Supabase library did not load — check your internet connection.');
                        const { data: { session } } = await client.auth.getSession();
                        CLOUD_SESSION = session;
                        if (session) {
                            await cloudLoadMember();
                            if (CLOUD_MEMBER) {
                                await cloudFinishConnect();
                            } else {
                                renderCloudFamilySetup();
                            }
                        } else {
                            renderCloudAuth('signin');
                        }
                        return;
                    } catch (e) {
                        console.error('cloud init failed', e);
                        CLOUD_STATUS = 'error';
                        CLOUD_LAST_ERROR = String(e.message || e);
                        CLOUD_ACTIVE = false;
                        toast('Cloud sync unavailable right now — continuing in local mode', 'error');
                        // fall through to the normal local flow below
                    }
                }
                if (DEVICE_PROFILE) {
                    CURRENT_ROUTE = 'quickentry';
                    render();
                } else if (!ONBOARDING_SKIPPED && activeList(DB.masters.banks).length) {
                    renderOnboarding(false);
                } else {
                    render();
                }
            }
            init();

        })();


    </script>
</body>

</html>
